</style></head><body><nav id="desktopNav" hidden aria-hidden="true"></nav><div class="app"><main class="main" id="content"></main></div><nav class="mobile-nav" id="mobileNav" aria-label="메인 메뉴"></nav><div id="modalRoot"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><input accept=".json,application/json" type="file" hidden id="importFile"><script>
'use strict';
const STORE='motohub_personal_v1';
const NAV=[['home','🏠','홈'],['listings','🔎','매물'],['garage','🏍️','차고'],['ride','🗺️','라이딩'],['more','⚙️','더보기']];
const dateNow=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const demoData=()=>({version:1,vehicles:[{id:'vehicle_cub',name:'혼다 슈퍼커브 110',year:2024,odo:0,purchase:0,plate:'',note:'샘플 차량: 실제 주행거리·구매가를 입력해 주세요.',isDemo:true}],watchlist:[{id:'watch_duke',model:'KTM 390 DUKE',year:2024,maxPrice:6000000,feature:'퀵시프터',note:'2024년식 이후 매물 관심',isDemo:true}],listings:[],services:[],expenses:[],shops:[],routes:[],specs:[{id:'spec1',model:'KTM 390 DUKE',year:'2024+',seat:'',weight:'',power:'',engine:'',quick:'확인 필요',memo:'제원은 공식 자료 확인 후 직접 입력'}, {id:'spec2',model:'혼다 슈퍼커브 110',year:'2024',seat:'',weight:'',power:'',engine:'',quick:'확인 필요',memo:''},{id:'spec3',model:'야마하 YZF-R3',year:'',seat:'',weight:'',power:'',engine:'',quick:'확인 필요',memo:''},{id:'spec4',model:'가와사키 Ninja ZX-4RR',year:'',seat:'',weight:'',power:'',engine:'',quick:'확인 필요',memo:''}],settings:{currency:'KRW'}});
let db,storageFailed=false;try{const loaded=JSON.parse(localStorage.getItem(STORE));db=loaded&&Array.isArray(loaded.vehicles)?loaded:demoData()}catch(_){db=demoData();storageFailed=true}
let tab='home',moreView='shops',listingFilters={q:'',status:'all',sort:'recent'},compareSet=new Set(),specSet=new Set(),gps={active:false,watchId:null,points:[],start:null,error:''},toastTimeout;
const fmt=(v)=>Number(v||0).toLocaleString('ko-KR');const won=(n)=>fmt(n)+'원';const el=(s)=>document.getElementById(s);const uid=()=>String(Date.now())+'_'+Math.random().toString(36).slice(2,7);
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=(v)=>esc(v).replace(/\n/g,'<br>');
const attr=(v)=>esc(v);
function persist(){try{localStorage.setItem(STORE,JSON.stringify(db));storageFailed=false}catch(e){storageFailed=true;notify('저장 공간이 차단됐어. 설정에서 JSON 백업을 받아줘.')} }
function notify(msg){let t=el('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.remove('show'),2700)}
const findVehicle=id=>db.vehicles.find(x=>x.id===id);
const bikeSelect=(selected)=>`<select class="select" name="vehicleId" required><option value="">바이크 선택</option>${db.vehicles.map(v=>`<option value="${attr(v.id)}" ${v.id===selected?'selected':''}>${esc(v.name)}</option>`).join('')}</select>`;
function go(name){if(!NAV.some(n=>n[0]===name))return;tab=name;render();scrollTo({top:0,behavior:'instant'})}
function getNav(){for(const target of ['desktopNav','mobileNav'])el(target).innerHTML=NAV.map(([id,emoji,label])=>`<button type="button" class="${target==='desktopNav'?'navbtn':''} ${tab===id?'active':''}" data-action="nav" data-id="${id}"><span class="emoji">${emoji}</span>${target==='mobileNav'?`<span>${label}</span>`:`<span>${label}</span>`}</button>`).join('')}
function heading(title,desc,action=''){return `<header class="topbar"><div><div class="eyebrow">MOTO HUB / PERSONAL</div><h1>${title}</h1><p>${desc}</p></div>${action?`<div class="actions">${action}</div>`:''}</header>`}
function btn(label,action,extra='',style=''){return `<button type="button" class="btn ${style}" data-action="${action}" ${extra}>${label}</button>`}
function empty(icon,msg,act=''){return `<div class="empty"><span class="emoji">${icon}</span>${msg}${act?`<div style="margin-top:15px">${act}</div>`:''}</div>`}
const sum=(arr)=>arr.reduce((a,b)=>a+Number(b||0),0);
function dueServices(){return db.services.filter(s=>s.nextDate||s.nextKm).map(s=>{const v=findVehicle(s.vehicleId);let deltaKm=s.nextKm&&v?Number(s.nextKm)-Number(v.odo||0):null;let days=s.nextDate?Math.ceil((new Date(s.nextDate+'T12:00:00')-new Date())/86400000):null;return {...s,bike:v?.name||'삭제된 차종',deltaKm,days,overdue:(deltaKm!==null&&deltaKm<=0)||(days!==null&&days<=0)}}).sort((a,b)=>Number(b.overdue)-Number(a.overdue)).slice(0,30)}
function home(){const month=dateNow().slice(0,7),spent=sum(db.expenses.filter(x=>x.date?.startsWith(month)).map(x=>x.amount))+sum(db.services.filter(x=>x.date?.startsWith(month)).map(x=>x.cost)),alerts=dueServices();let expensesByMonth=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const ym=d.toLocaleDateString('en-CA').slice(0,7);expensesByMonth.push({label:(d.getMonth()+1)+'월',value:sum(db.expenses.filter(x=>x.date?.startsWith(ym)).map(x=>x.amount))+sum(db.services.filter(x=>x.date?.startsWith(ym)).map(x=>x.cost))})}const max=Math.max(1,...expensesByMonth.map(x=>x.value));return heading('라이더 대시보드','내 차고, 매물, 정비, 지출을 한 번에 확인해.')+`<div class="hero"><span class="chip gold">PERSONAL RIDER COMMAND</span><h2>내 바이크 생활, 한 화면에서.</h2><p>중고매물 찾다가 정비 시기를 잊어버리는 일 없도록. 기록과 비교부터 시작해 보자.</p>${btn('＋ 관심 매물 등록','add-listing','','primary')} ${btn('정비 기록 추가','add-service','','secondary')}</div><div class="grid kpi-grid" style="margin-top:16px"><section class="card span-3"><div class="kpi-label">내 차고</div><div class="big">${db.vehicles.length}<span class="small muted"> 대</span></div><div class="kpi-hint">등록된 바이크</div></section><section class="card span-3"><div class="kpi-label">저장한 매물</div><div class="big">${db.listings.length}<span class="small muted"> 건</span></div><div class="kpi-hint">자동수집 미연동</div></section><section class="card span-3"><div class="kpi-label">이번 달 지출</div><div class="big">${fmt(spent)}<span class="small muted"> 원</span></div><div class="kpi-hint">직접 기록한 지출만</div></section><section class="card span-3"><div class="kpi-label">정비 예정</div><div class="big">${alerts.length}<span class="small muted"> 건</span></div><div class="kpi-hint">직접 입력한 주기 기준</div></section></div><div class="grid" style="margin-top:16px"><section class="card span-7"><div class="top"><h2>🏍️ 내 차고</h2><button class="link" data-action="nav" data-id="garage">차고 관리 →</button></div>${db.vehicles.length?`<div class="list">${db.vehicles.map(v=>`<div class="item"><div class="item-head"><div><div class="item-title">${esc(v.name)} ${v.year?'· '+esc(v.year):''}</div><div class="item-body">주행거리 <strong style="color:white">${fmt(v.odo)} km</strong> ${v.isDemo?'<span class="chip gold">샘플 · 주행거리 수정 필요</span>':''}</div></div>${btn('수정','edit-bike',`data-id="${v.id}"`,'small')}</div></div>`).join('')}</div>`:empty('🏍️','등록한 바이크가 없어.',btn('바이크 추가','add-bike','','primary'))}</section><section class="card span-5"><div class="top"><h2>🔧 정비 예정</h2><button class="link" data-action="nav" data-id="garage">전체 보기 →</button></div>${alerts.length?`<div class="list">${alerts.slice(0,4).map(s=>`<div class="item"><div class="item-head"><strong>${esc(s.type)}</strong><span class="chip ${s.overdue?'red':'blue'}">${s.overdue?'점검 필요':'예정'}</span></div><div class="item-body">${esc(s.bike)} · ${s.nextKm?fmt(s.nextKm)+'km':''} ${s.nextDate?esc(s.nextDate):''}</div></div>`).join('')}</div>`:empty('✅','등록된 정비 예정이 없어.<br>정비 주기는 직접 설정할 수 있어.')}</section><section class="card span-7"><div class="top"><h2>💸 최근 6개월 지출</h2><span class="tiny muted">본인 입력 기준</span></div><div class="bars">${expensesByMonth.map(x=>`<div class="bar-col"><div class="small" title="${won(x.value)}">${x.value?Math.round(x.value/10000)+'만':''}</div><div class="bar" style="height:${Math.max(3,Math.round(113*x.value/max))}px"></div><div class="small">${x.label}</div></div>`).join('')}</div></section><section class="card span-5"><div class="top"><h2>🎯 관심 차종</h2>${btn('추가','add-watch','','small')}</div>${db.watchlist.length?`<div class="list">${db.watchlist.map(w=>`<div class="item"><div class="item-title">${esc(w.model)}</div><div class="item-body">${w.year?esc(w.year)+'년식 이상 · ':''}${w.maxPrice?'최대 '+fmt(w.maxPrice/10000)+'만 원 · ':''}${esc(w.feature||'옵션 무관')}</div><div class="item-foot">${btn('매물 검색','search-watch',`data-id="${w.id}"`,'small')}${btn('수정','edit-watch',`data-id="${w.id}"`,'small')}</div></div>`).join('')}</div>`:empty('🎯','등록한 관심 차종이 없어.')}</section></div>${footer()}`}
function listingSearchLinks(model=''){let q=encodeURIComponent((model?model+' ':'')+'중고 바이크');return `<div class="flex" style="margin-bottom:15px"><a class="btn small" href="https://www.reitwagen.co.kr/products/home/used" target="_blank" rel="noopener noreferrer">라이트바겐 ↗</a><a class="btn small" href="https://bikeweb.bikemart.co.kr/" target="_blank" rel="noopener noreferrer">바이크마트 ↗</a><a class="btn small" href="https://search.naver.com/search.naver?query=${q}" target="_blank" rel="noopener noreferrer">네이버/카페 검색 ↗</a></div>`}
function listCard(l){let hist=l.priceHistory||[],change=hist.length>1?Number(hist.at(-1).price)-Number(hist[0].price):0;return `<article class="item"><div class="item-head"><div><div class="item-title"><input type="checkbox" data-check-list="${attr(l.id)}" ${compareSet.has(l.id)?'checked':''} aria-label="비교 선택" style="margin-right:8px"/>${esc(l.model)} ${l.year?esc(l.year)+'년식':''}</div><div class="item-body">${esc(l.source||'출처 미입력')} · ${l.mileage?fmt(l.mileage)+' km · ':''}${esc(l.region||'지역 미입력')}</div></div><div style="text-align:right"><div class="price">${fmt(l.price/10000)}만원</div><div class="tiny muted">${change===0?'가격 기록 '+Math.max(1,hist.length)+'회':(change>0?'+':'')+fmt(change/10000)+'만 변동'}</div></div></div><div class="flex" style="margin-top:11px"><span class="chip ${l.status==='판매완료'?'red':l.status==='판매중'?'green':'gold'}">${esc(l.status)}</span><span class="chip">퀵시프터 ${esc(l.quick||'미확인')}</span><span class="chip">${l.url?'원문 링크 있음':'링크 없음'}</span></div>${l.notes?`<div class="item-body">${text(l.notes)}</div>`:''}<div class="item-foot">${btn('기본 분석','analyze-listing',`data-id="${l.id}"`,'small')}${btn('가격 수정','price-listing',`data-id="${l.id}"`,'small')}${btn('수정','edit-listing',`data-id="${l.id}"`,'small')}${btn('상태 변경','status-listing',`data-id="${l.id}"`,'small')}${l.url?`<a class="btn small" href="${attr(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer">원문 ↗</a>`:''}${btn('삭제','delete-listing',`data-id="${l.id}"`,'small danger')}</div></article>`}
function listings(){let x=db.listings.filter(l=>[l.model,l.source,l.region,l.notes].join(' ').toLowerCase().includes(listingFilters.q.toLowerCase())&&(listingFilters.status==='all'||l.status===listingFilters.status));if(listingFilters.sort==='cheap')x.sort((a,b)=>a.price-b.price);else if(listingFilters.sort==='expensive')x.sort((a,b)=>b.price-a.price);else x.sort((a,b)=>(b.created||'').localeCompare(a.created||''));return heading('중고매물','관심 매물을 저장하고 가격·옵션·상태를 직접 관리해.',btn('＋ 매물 등록','add-listing','','primary'))+`<div class="warn" style="margin-bottom:14px">자동 매물 수집과 실시간 판매 상태 확인은 아직 연결되지 않았어. 외부 검색으로 찾은 매물 링크를 직접 등록하는 방식이야.</div><div class="card" style="margin-bottom:16px"><div class="top"><h2>외부 사이트 검색</h2><span class="chip blue">새 창 열기</span></div>${listingSearchLinks(db.watchlist[0]?.model||'')}<div class="small muted">관심 차종: ${esc(db.watchlist.map(w=>w.model).join(' / ')||'미등록')}</div></div><div class="filters"><input class="input" id="listing-q" placeholder="차종, 지역, 메모 검색" value="${attr(listingFilters.q)}"><select class="select" id="listing-status"><option value="all">전체 상태</option>${['판매중','예약중','판매완료','확인필요'].map(s=>`<option ${listingFilters.status===s?'selected':''}>${s}</option>`).join('')}</select><select class="select" id="listing-sort"><option value="recent">최근 등록순</option><option value="cheap" ${listingFilters.sort==='cheap'?'selected':''}>낮은 가격순</option><option value="expensive" ${listingFilters.sort==='expensive'?'selected':''}>높은 가격순</option></select></div><div class="row-end" style="margin-bottom:12px"><span class="small muted">${x.length}개 매물 · 비교 ${compareSet.size}개 선택</span>${btn('선택 매물 비교','compare-listings',compareSet.size<2?'disabled':'','small')}</div><div class="list">${x.length?x.map(listCard).join(''):empty('🔎','조건에 맞는 저장 매물이 없어.',btn('매물 등록','add-listing','','primary'))}</div>${footer()}`}
function garage(){const costs=sum(db.expenses.map(x=>x.amount))+sum(db.services.map(x=>x.cost));const alerts=dueServices();return heading('내 차고','정비, 주유, 보험, 비용 기록을 바이크별로 관리해.',btn('＋ 바이크','add-bike','','primary'))+`<div class="grid kpi-grid"><div class="card span-3"><div class="kpi-label">등록 바이크</div><div class="big">${db.vehicles.length}대</div></div><div class="card span-3"><div class="kpi-label">누적 기록 지출</div><div class="big">${fmt(Math.round(costs/10000))}만</div></div><div class="card span-3"><div class="kpi-label">정비 내역</div><div class="big">${db.services.length}건</div></div><div class="card span-3"><div class="kpi-label">정비 예정</div><div class="big">${alerts.length}건</div></div></div><div class="grid" style="margin-top:16px"><section class="card span-12"><div class="top"><h2>내 바이크</h2><span class="tiny muted">차량 정보를 수정하면 예정 주행거리도 갱신돼</span></div><div class="grid">${db.vehicles.map(v=>`<div class="span-6 item"><div class="title-line"><div class="square">01</div><div><div class="item-title">${esc(v.name)}</div><div class="item-body">${esc(v.year||'연식 미입력')} · ${fmt(v.odo)} km</div></div></div><div class="item-foot">${btn('주행거리 변경','odo-bike',`data-id="${v.id}"`,'small')}${btn('차량 수정','edit-bike',`data-id="${v.id}"`,'small')}${btn('삭제','delete-bike',`data-id="${v.id}"`,'small danger')}</div></div>`).join('')||empty('🏍️','바이크를 추가해 줘.')}</div></section><section class="card span-6"><div class="top"><h2>정비 기록</h2>${btn('＋ 정비 기록','add-service','','small primary')}</div>${db.services.length?`<div class="list">${db.services.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,8).map(s=>`<div class="item"><div class="item-head"><strong>${esc(s.type)}</strong><span>${won(s.cost)}</span></div><div class="item-body">${esc(findVehicle(s.vehicleId)?.name||'삭제된 차량')} · ${esc(s.date||'')} ${s.mileage?'· '+fmt(s.mileage)+'km':''}</div><div class="item-foot">${s.nextKm?`<span class="chip blue">다음 ${fmt(s.nextKm)} km</span>`:''}${s.nextDate?`<span class="chip blue">${esc(s.nextDate)} 예정</span>`:''}${btn('삭제','delete-service',`data-id="${s.id}"`,'small danger')}</div></div>`).join('')}</div>`:empty('🧰','정비 기록을 추가하면 다음 정비 시점도 관리할 수 있어.')}</section><section class="card span-6"><div class="top"><h2>비용·주유</h2><div class="flex">${btn('주유','add-fuel','','small')}${btn('지출','add-expense','','small primary')}</div></div>${db.expenses.length?`<div class="list">${db.expenses.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,8).map(s=>`<div class="item"><div class="item-head"><strong>${esc(s.type)} ${esc(s.title||'')}</strong><span>${won(s.amount)}</span></div><div class="item-body">${esc(findVehicle(s.vehicleId)?.name||'삭제된 차량')} · ${esc(s.date)} ${s.liters?'· '+esc(s.liters)+'L':''}</div><div class="item-foot">${btn('삭제','delete-expense',`data-id="${s.id}"`,'small danger')}</div></div>`).join('')}</div>`:empty('⛽','주유·보험·부품값을 기록해 보자.')}</section><section class="card span-12"><div class="top"><h2>기변 계산기</h2><span class="chip gold">실시간 계산</span></div><div class="formgrid"><label><span class="label">새 바이크 구매가(원)</span><input id="calc-buy" class="input" inputmode="numeric" type="number" min="0" placeholder="예: 5500000"/></label><label><span class="label">현재 바이크 판매 예상가(원)</span><input id="calc-sell" class="input" inputmode="numeric" type="number" min="0" placeholder="예: 2000000"/></label><label><span class="label">취등록·운송·정비 등 추가 비용(원)</span><input id="calc-extra" class="input" inputmode="numeric" type="number" min="0" placeholder="예: 300000"/></label><label><span class="label">연간 보험료 차이(원)</span><input id="calc-insurance" class="input" inputmode="numeric" type="number" placeholder="예: 200000"/></label></div><div class="separator"></div><div class="row-end"><span class="muted">첫해 추가 부담 추정</span><div class="big" id="calc-result">0원</div></div><div class="field-note">신규 구매가 − 기존 판매가 + 추가 비용 + 연간 보험 차이. 개인 입력값 기준이며 다른 유지비와 감가는 별도.</div></section></div>${footer()}`}
function ride(){return heading('라이딩','즐겨찾기 코스를 관리하고 가능한 환경에서 GPS를 기록해.',btn('＋ 코스 저장','add-route','','primary'))+`<div class="warn" style="margin-bottom:16px">오토바이는 자동차전용도로·고속도로 등 통행 제한을 반드시 확인해야 해. 지도 서비스가 보여준 경로를 출발 전에 검토하고 주행 중 앱을 조작하지 마. 웹 기반 GPS 기록은 백그라운드에서 중단될 수 있어.</div><div class="grid"><section class="card span-6"><div class="top"><h2>실시간 위치 기록</h2><span class="chip ${gps.active?'green':'blue'}">${gps.active?'기록 중':'대기'}</span></div><div class="big" id="gps-dist">${gpsKm()} km</div><div class="item-body">누적 거리(위치 오차에 영향받음) · <span id="gps-count">${gps.points.length}</span>개 포인트</div><div class="item-foot">${gps.active?btn('■ 기록 종료 및 저장','stop-gps','','primary'):btn('● GPS 기록 시작','start-gps','','primary')}${gps.points.length&&!gps.active?btn('GPX 내보내기','export-gpx','','small'):''}</div><div class="field-note">권한 허용과 브라우저 보안 환경이 필요해. 실제 속도계·안전장비를 대체하지 않아.</div>${gps.error?`<div class="chip red" style="margin-top:12px">${esc(gps.error)}</div>`:''}</section><section class="card span-6"><div class="top"><h2>경로 빠른 검색</h2><span class="tiny muted">외부 지도로 이동</span></div><label class="label">가고 싶은 목적지</label><input class="input" id="route-dest" placeholder="예: 두물머리, 여주 이포보"/><div class="item-foot">${btn('네이버지도 검색','nav-search','','small')}${btn('카카오맵 검색','kakao-search','','small')}</div><div class="field-note">이륜차 운행 가능 여부는 별도로 확인해 줘.</div></section><section class="card span-12"><div class="top"><h2>저장한 라이딩 코스</h2><span class="small muted">${db.routes.length}개</span></div>${db.routes.length?`<div class="grid">${db.routes.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>`<div class="span-6 item"><div class="item-head"><div class="item-title">${esc(r.name)}</div><span class="chip">${r.points?.length?'GPS 기록':'계획 코스'}</span></div><div class="item-body">${esc(r.start||'출발 미입력')} → ${esc(r.end||'도착 미입력')}<br>${r.date?esc(r.date)+' · ':''}${r.distance?fmt(Number(r.distance))+' km':''}</div>${r.notes?`<div class="item-body">${text(r.notes)}</div>`:''}<div class="item-foot">${r.end?`<a class="btn small" href="https://map.naver.com/p/search/${encodeURIComponent(r.end)}" target="_blank" rel="noopener noreferrer">목적지 지도 ↗</a>`:''}${r.points?.length?btn('GPX 저장','export-saved-gpx',`data-id="${r.id}"`,'small'):''}${btn('수정','edit-route',`data-id="${r.id}"`,'small')}${btn('삭제','delete-route',`data-id="${r.id}"`,'small danger')}</div></div>`).join('')}</div>`:empty('🗺️','나만의 코스를 하나 저장해 보자.',btn('첫 코스 추가','add-route','','primary'))}</section></div>${footer()}`}
function more(){const tabs=[['shops','정비소'],['specs','차종 비교'],['settings','설정/백업']];return heading('더보기','정비소·차종 비교·데이터 백업 관리.')+`<div class="pills">${tabs.map(([id,label])=>`<button class="pill ${moreView===id?'active':''}" data-action="more-tab" data-id="${id}">${label}</button>`).join('')}</div>${moreView==='shops'?shopsView():moreView==='specs'?specsView():settingsView()}${footer()}`}
function shopsView(){return `<div class="grid"><section class="card span-5"><div class="top"><h2>주변 정비소 찾기</h2></div><label class="label">위치와 정비 키워드</label><input class="input" id="shop-keyword" placeholder="예: 이천 KTM 오토바이 정비"/><div class="item-foot">${btn('네이버지도','find-shop-naver','','small')}${btn('카카오맵','find-shop-kakao','','small')}</div><div class="field-note">검색 결과와 영업정보는 외부 지도에서 확인. 이 앱은 특정 업체의 공임·평점을 만들어 표시하지 않아.</div></section><section class="card span-7"><div class="top"><h2>나의 정비소 수첩</h2>${btn('＋ 정비소 기록','add-shop','','small primary')}</div>${db.shops.length?`<div class="list">${db.shops.map(s=>`<div class="item"><div class="item-head"><strong>${esc(s.name)}</strong><span class="chip">${s.cost?won(s.cost):'견적 미기록'}</span></div><div class="item-body">${esc(s.location)} · ${esc(s.specialty||'분야 미입력')}</div>${s.notes?`<div class="item-body">${text(s.notes)}</div>`:''}<div class="item-foot">${btn('수정','edit-shop',`data-id="${s.id}"`,'small')}${btn('삭제','delete-shop',`data-id="${s.id}"`,'small danger')}${s.location?`<a class="btn small" target="_blank" rel="noopener noreferrer" href="https://map.naver.com/p/search/${encodeURIComponent(s.name+' '+s.location)}">지도 ↗</a>`:''}</div></div>`).join('')}</div>`:empty('🧰','직접 확인한 정비소와 견적을 저장해.')}</section></div>`}
function specsView(){let selected=[...specSet].map(id=>db.specs.find(s=>s.id===id)).filter(Boolean);return `<div class="card"><div class="top"><h2>바이크 제원 비교</h2>${btn('＋ 차종 추가','add-spec','','small primary')}</div><div class="warn" style="margin-bottom:16px">차종명만 기본 제공하고 시트고·중량·출력 등의 숫자는 비워뒀어. 공식 자료를 확인해 입력하면 비교할 수 있어. 추정 제원으로 구매 결정을 내리지 않도록 한 거야.</div><div class="grid">${db.specs.map(s=>`<div class="item span-6"><div class="item-head"><div><div class="item-title"><input type="checkbox" data-check-spec="${s.id}" ${specSet.has(s.id)?'checked':''} style="margin-right:6px" aria-label="비교 선택">${esc(s.model)}</div><div class="item-body">${esc(s.year||'연식 미입력')}</div></div>${btn('수정','edit-spec',`data-id="${s.id}"`,'small')}</div><div class="flex" style="margin-top:9px"><span class="chip">시트고 ${esc(s.seat||'?')} mm</span><span class="chip">중량 ${esc(s.weight||'?')} kg</span><span class="chip">배기량 ${esc(s.engine||'?')} cc</span></div><div class="item-foot">${btn('삭제','delete-spec',`data-id="${s.id}"`,'small danger')}</div></div>`).join('')}</div><div class="separator"></div><h2 style="margin-bottom:14px">선택 차종 비교 (${selected.length}대)</h2>${selected.length>=2?`<div class="table-wrap"><table><thead><tr><th>항목</th>${selected.map(s=>`<th>${esc(s.model)}</th>`).join('')}</tr></thead><tbody>${[['연식','year'],['시트고 (mm)','seat'],['중량 (kg)','weight'],['배기량 (cc)','engine'],['출력 (마력)','power'],['퀵시프터','quick'],['메모','memo']].map(([name,key])=>`<tr><th>${name}</th>${selected.map(s=>`<td>${esc(s[key]||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:empty('📊','두 개 이상 선택하면 제원을 비교할 수 있어.')}</div>`}
function settingsView(){return `<div class="grid"><section class="card span-7"><div class="top"><h2>내 데이터</h2></div><div class="okbox" style="margin-bottom:14px">모든 기본 데이터는 이 앱에 저장돼. 서버나 계정이 없으므로 휴대폰 변경이나 앱 삭제 전에 텍스트 백업을 보관해.</div><button class="settings-link" data-action="export-json"><span>전체 데이터 JSON 백업</span><span>복사하기 ↓</span></button><button class="settings-link" data-action="import-json"><span>JSON 백업 불러오기</span><span>붙여넣기 ↗</span></button><button class="settings-link" data-action="export-list-csv"><span>중고매물 CSV 내보내기</span><span>다운로드 ↓</span></button><button class="settings-link" data-action="export-exp-csv"><span>지출/정비 CSV 내보내기</span><span>다운로드 ↓</span></button><button class="settings-link" data-action="reset-db"><span style="color:#ffa4a4">모든 기록 초기화</span><span>삭제</span></button></section><section class="card span-5"><div class="top"><h2>앱 정보</h2></div><div class="statrow"><span class="muted">버전</span><strong>안드로이드 개인용 1.0</strong></div><div class="statrow"><span class="muted">이용 요금</span><strong>0원 · 자체 파일</strong></div><div class="statrow"><span class="muted">자동 매물 수집</span><strong>미연동</strong></div><div class="statrow"><span class="muted">AI API 분석</span><strong>미연동 · 규칙 기반</strong></div><div class="statrow"><span class="muted">클라우드 동기화</span><strong>미연동</strong></div><div class="statrow"><span class="muted">GPS</span><strong>전경 사용만 가능</strong></div><div class="separator"></div><div class="small muted" style="line-height:1.8">파일을 브라우저에서 열어 사용해. 브라우저 데이터를 지우거나 기기를 바꾸면 기록이 사라질 수 있으니 정기적으로 JSON 백업을 받아줘. 일부 기기에서는 로컬 파일 저장이 제한될 수 있어.${storageFailed?'<br><span style="color:#ffadad">현재 저장소 접근이 차단됐을 수 있음</span>':''}</div></section></div>`}
function footer(){return `<div class="footer">MOTO HUB · 개인 사용을 위한 오프라인 웹앱. 매물 시세/판매 상태/지도 검색 내용은 실시간 검증되지 않으며, 안전·법적 판단은 공식 정보로 확인해야 해.</div>`}
function render(){getNav();el('content').innerHTML=({home,listings,garage,ride,more})[tab]();if(tab==='garage')calcRefresh()}
const f=(title,name,type='text',val='',opts={})=>`<label class="${opts.full?'full':''}"><span class="label">${title}${opts.req?' *':''}</span>${opts.kind==='textarea'?`<textarea class="input" name="${name}" rows="3" ${opts.req?'required':''} placeholder="${attr(opts.placeholder||'')}">${esc(val)}</textarea>`:opts.kind==='select'?`<select class="select" name="${name}">${(opts.options||[]).map(x=>`<option value="${attr(x)}" ${String(val)===String(x)?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input class="input" type="${type}" name="${name}" value="${attr(val)}" ${opts.req?'required':''} ${type==='number'?'min="0"':''} placeholder="${attr(opts.placeholder||'')}"/>`}</label>`;
function modal(title,body,formName='',submit='저장'){el('modalRoot').innerHTML=`<div class="modal-backdrop" id="modalOverlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${attr(title)}"><h2>${esc(title)}</h2><p>${formName?'입력한 내용은 현재 기기에만 저장돼.':'모토허브 · 개인용 도구'}</p>${formName?`<form data-form="${formName}">${body}<div class="modal-actions">${btn('취소','close-modal','','secondary')}<button class="btn primary" type="submit">${submit}</button></div></form>`:`${body}<div class="modal-actions">${btn('닫기','close-modal','','secondary')}</div>`}</div></div>`;el('modalOverlay').addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal()})}
function closeModal(){el('modalRoot').innerHTML=''}
function formBike(v){v=v||{};modal(v.id?'바이크 정보 수정':'바이크 등록',`<div class="formgrid"><input type="hidden" name="id" value="${attr(v.id||'')}">${f('차종명','name','text',v.name,{req:true})}${f('연식','year','number',v.year)}${f('현재 주행거리 (km)','odo','number',v.odo)}${f('구매가 (원)','purchase','number',v.purchase)}${f('차량번호 (선택)','plate','text',v.plate)}${f('메모','note','text',v.note,{full:true})}</div>`,'bike')}
function formWatch(v){v=v||{};modal(v.id?'관심 차종 수정':'관심 차종 등록',`<div class="formgrid"><input type="hidden" name="id" value="${attr(v.id||'')}">${f('차종','model','text',v.model,{req:true})}${f('최소 연식','year','number',v.year)}${f('최대 가격 (원)','maxPrice','number',v.maxPrice)}${f('필수 옵션','feature','text',v.feature)}${f('메모','note','text',v.note,{full:true})}</div>`,'watch')}
function formListing(l){l=l||{};modal(l.id?'매물 수정':'중고매물 등록',`<div class="formgrid"><input type="hidden" name="id" value="${attr(l.id||'')}">${f('차종명','model','text',l.model,{req:true})}${f('연식','year','number',l.year)}${f('판매가 (원)','price','number',l.price,{req:true})}${f('주행거리 (km)','mileage','number',l.mileage)}${f('지역','region','text',l.region)}${f('출처','source','text',l.source,{placeholder:'바튜매, 라이트바겐 등'})}${f('퀵시프터','quick','text',l.quick||'미확인')}${f('판매 상태','status','text',l.status||'확인필요')}${f('원본 링크','url','url',l.url,{full:true,placeholder:'https://...'})}${f('튜닝/하자/정비 이력 메모','notes','text',l.notes,{full:true})}</div><div class="field-note" style="margin-top:10px">판매 상태는 직접 확인해서 변경해. 원문 사이트의 상태가 자동 반영되지는 않아.</div>`,'listing')}
function formService(s){s=s||{};if(!db.vehicles.length){notify('차량을 먼저 등록해 줘.');formBike();return}modal('정비 기록 추가',`<div class="formgrid"><label><span class="label">바이크 *</span>${bikeSelect(s.vehicleId||db.vehicles[0].id)}</label>${f('정비 항목','type','text',s.type,{req:true,placeholder:'엔진오일 교환 등'})}${f('정비 날짜','date','date',s.date||dateNow(),{req:true})}${f('정비 당시 주행거리 (km)','mileage','number',s.mileage)}${f('정비 비용 (원)','cost','number',s.cost)}${f('다음 정비 예정 거리 (km)','nextKm','number',s.nextKm)}${f('다음 정비 예정일','nextDate','date',s.nextDate)}${f('정비소/메모','note','text',s.note,{full:true})}</div><div class="field-note">정비 주기는 제조사/정비 매뉴얼을 참고하여 본인이 입력해 줘.</div>`,'service')}
function formExpense(e,asFuel=false){e=e||{};if(!db.vehicles.length){notify('차량을 먼저 등록해 줘.');formBike();return}modal(asFuel?'주유 기록 추가':'지출 기록 추가',`<div class="formgrid"><label><span class="label">바이크 *</span>${bikeSelect(e.vehicleId||db.vehicles[0].id)}</label>${f('구분','type','text',e.type||(asFuel?'주유':'부품/보험/기타'),{req:true})}${f('날짜','date','date',e.date||dateNow(),{req:true})}${f('금액 (원)','amount','number',e.amount,{req:true})}${f('주유량 (L)','liters','number',e.liters,{placeholder:'주유 시 입력'})}${f('당시 주행거리 (km)','mileage','number',e.mileage)}${f('상세 내용','title','text',e.title,{full:true})}</div>`,'expense')}
function formShop(s){s=s||{};modal(s.id?'정비소 수정':'정비소 기록',`<div class="formgrid"><input type="hidden" name="id" value="${attr(s.id||'')}">${f('매장명','name','text',s.name,{req:true})}${f('주소/지역','location','text',s.location)}${f('전문 차종/분야','specialty','text',s.specialty)}${f('직접 확인한 견적 (원)','cost','number',s.cost)}${f('내 메모·후기','notes','text',s.notes,{full:true})}</div>`,'shop')}
function formRoute(r){r=r||{};modal(r.id?'코스 수정':'라이딩 코스 저장',`<div class="formgrid"><input type="hidden" name="id" value="${attr(r.id||'')}">${f('코스 이름','name','text',r.name,{req:true})}${f('날짜','date','date',r.date||dateNow())}${f('출발지','start','text',r.start)}${f('도착지','end','text',r.end)}${f('경유지 (쉼표로 구분)','waypoints','text',r.waypoints)}${f('거리 (km)','distance','number',r.distance)}${f('코스 메모','notes','text',r.notes,{full:true})}</div>`,'route')}
function formSpec(s){s=s||{};modal(s.id?'차종 제원 수정':'차종 제원 추가',`<div class="formgrid"><input type="hidden" name="id" value="${attr(s.id||'')}">${f('차종명','model','text',s.model,{req:true})}${f('연식','year','text',s.year)}${f('시트고 (mm)','seat','number',s.seat)}${f('중량 (kg)','weight','number',s.weight)}${f('배기량 (cc)','engine','number',s.engine)}${f('출력 (마력)','power','number',s.power)}${f('퀵시프터','quick','text',s.quick)}${f('특징 / 출처 메모','memo','text',s.memo,{full:true})}</div>`,'spec')}
function safeUrl(url){try{const u=new URL(url);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
function basicAnalysis(l){const comps=db.listings.filter(x=>x.id!==l.id&&x.model.trim().toLowerCase()===l.model.trim().toLowerCase()&&Number(x.price)>0&&x.status!=='판매완료').map(x=>Number(x.price)).sort((a,b)=>a-b);const med=comps.length?comps.length%2?comps[(comps.length-1)/2]:(comps[comps.length/2-1]+comps[comps.length/2])/2:0;const delta=med?(l.price/med-1)*100:null;const flags=[!l.mileage?'주행거리 미확인':null,!l.url?'원문 링크 미등록':null,(!l.notes||l.notes.length<10)?'정비·사고 이력 정보 부족':null,l.quick==='미확인'?'퀵시프터 장착 여부 미확인':null,l.status!=='판매중'?'판매 가능 여부 확인 필요':null].filter(Boolean);const body=`<div class="warn">이 결과는 AI 진단이 아닌 저장 데이터에 기반한 <b>기본 규칙 분석</b>이야. 사고 유무·기계 결함·실제 시세는 판정할 수 없어.</div><div class="separator"></div><div class="row-end"><span class="muted">분석 대상</span><b>${esc(l.model)} · ${fmt(l.price/10000)}만원</b></div><div class="statrow"><span class="muted">비교 가능한 저장 매물</span><strong>${comps.length}건</strong></div><div class="statrow"><span class="muted">저장 매물 중앙가격</span><strong>${comps.length>=2?won(med):'2건 이상 필요'}</strong></div><div class="statrow"><span class="muted">가격 차이</span><strong>${comps.length>=2?(delta>0?'+':'')+delta.toFixed(1)+'%':'판단 보류'}</strong></div><div class="separator"></div><h3 style="font-size:14px">구매 전 확인 필요</h3><div class="list">${[...flags,'차대번호·등록 서류 일치','누유·시동·냉각·타이어·체인 상태','사고/전도·프레임·카울 교체 흔적','순정 부품 및 튜닝 구조변경 적법성'].map(s=>`<div class="item" style="font-size:12px">✓ ${esc(s)}</div>`).join('')}</div><div class="field-note">같은 차종이어도 연식·옵션·지역·사고 이력에 따라 가격은 달라져. 단순 중앙값은 참고만 해.</div>`;modal('매물 기본 분석',body)}
function compareListings(){const arr=[...compareSet].map(id=>db.listings.find(l=>l.id===id)).filter(Boolean);if(arr.length<2){notify('2개 이상 선택해 줘.');return}modal('매물 비교',`<div class="table-wrap"><table><thead><tr><th>항목</th>${arr.map(l=>`<th>${esc(l.model)}</th>`).join('')}</tr></thead><tbody>${[['가격','price'],['연식','year'],['주행거리','mileage'],['지역','region'],['퀵시프터','quick'],['상태','status'],['출처','source']].map(([label,key])=>`<tr><th>${label}</th>${arr.map(l=>`<td>${esc(key==='price'?won(l[key]):key==='mileage'?fmt(l[key])+' km':l[key]||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`)}
function calcRefresh(){if(!el('calc-buy'))return;const get=id=>Number(el(id)?.value||0);const cost=get('calc-buy')-get('calc-sell')+get('calc-extra')+get('calc-insurance');el('calc-result').textContent=(cost<0?'-':'')+won(Math.abs(cost))}
function startGps(){if(!navigator.geolocation){notify('이 브라우저는 위치 측정을 지원하지 않아.');return}if(gps.active)return;gps.error='';gps.points=[];gps.start=Date.now();gps.active=true;gps.watchId=navigator.geolocation.watchPosition(pos=>{const p={lat:pos.coords.latitude,lon:pos.coords.longitude,ele:pos.coords.altitude||0,time:new Date().toISOString(),acc:pos.coords.accuracy};if(p.acc>100)return;const old=gps.points.at(-1);if(old){const d=geoDistance(old,p);if(d<0.005||d>0.5)return}gps.points.push(p);if(tab==='ride'){if(el('gps-dist'))el('gps-dist').textContent=gpsKm()+' km';if(el('gps-count'))el('gps-count').textContent=gps.points.length}},err=>{gps.error=err.message||'위치 접근 실패';if(err.code===1){stopGps(false);notify('위치 권한이 거부됐어.')}else{notify('GPS 위치 정보가 정확하지 않아.');if(tab==='ride')render()}},{enableHighAccuracy:true,maximumAge:2000,timeout:15000});render();notify('위치 측정을 시작했어. 정차 중에만 조작해 줘.')}
function geoDistance(a,b){const rad=x=>x*Math.PI/180;const R=6371,lat=rad(b.lat-a.lat),lon=rad(b.lon-a.lon),z=Math.sin(lat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(lon/2)**2;return 2*R*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}
function gpsKm(){return (gps.points.reduce((s,p,i)=>s+(i?geoDistance(gps.points[i-1],p):0),0)).toFixed(2)}
function stopGps(save=true){if(gps.watchId!==null)navigator.geolocation.clearWatch(gps.watchId);gps.active=false;gps.watchId=null;if(save&&gps.points.length){const name=prompt('라이딩 기록 이름을 입력해 줘','GPS 라이딩 '+dateNow());if(name){db.routes.push({id:uid(),name,date:dateNow(),start:'GPS 기록',end:'GPS 기록',waypoints:'',distance:Number(gpsKm()),notes:'전경 GPS 측정 · 오차 가능',points:structuredClone(gps.points)});persist();notify('라이딩 경로가 저장됐어.')}}else if(save)notify('저장할 GPS 포인트가 없어.');render()}
function download(filename,data,mime){const blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function gpxFile(points,title){const xml=(s)=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));return `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="MOTO HUB" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>${xml(title)}</name><trkseg>${points.map(p=>`<trkpt lat="${p.lat}" lon="${p.lon}"><ele>${Number(p.ele)||0}</ele><time>${xml(p.time||new Date().toISOString())}</time></trkpt>`).join('')}</trkseg></trk></gpx>`}
function csv(rows){const str=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return '\ufeff'+rows.map(row=>row.map(str).join(',')).join('\r\n')}
function openExternalMap(provider,value){if(!value?.trim()){notify('검색어를 먼저 입력해 줘.');return}const url=provider==='kakao'?'https://map.kakao.com/?q='+encodeURIComponent(value):'https://map.naver.com/p/search/'+encodeURIComponent(value);window.open(url,'_blank','noopener,noreferrer')}
function updateRow(name,val){db[name]=val;persist();render()}
function confirmDelete(collection,id,name){if(!confirm(name+'을(를) 삭제할까?'))return;db[collection]=db[collection].filter(x=>x.id!==id);if(collection==='listings')compareSet.delete(id);if(collection==='specs')specSet.delete(id);persist();render();notify('삭제했어.')}
function handleAction(action,id){const find=(collection)=>db[collection].find(x=>x.id===id);switch(action){case'nav':go(id);break;case'more-tab':moreView=id;render();break;case'close-modal':closeModal();break;case'add-bike':formBike();break;case'edit-bike':formBike(find('vehicles'));break;case'odo-bike':{const v=find('vehicles');if(!v)return;const val=prompt('현재 주행거리(km)',v.odo);if(val===null)return;const n=Number(val);if(!Number.isFinite(n)||n<0){notify('유효한 거리를 입력해 줘.');return}v.odo=n;v.isDemo=false;persist();render();break}case'delete-bike':{if(db.vehicles.length<=1){notify('마지막 바이크를 지우기 전에 다른 차량을 등록해 줘.');return}confirmDelete('vehicles',id,'바이크');break}case'add-watch':formWatch();break;case'edit-watch':formWatch(find('watchlist'));break;case'search-watch':{let w=find('watchlist');if(!w)return;go('listings');listingFilters.q=w.model;render();break}case'add-listing':formListing();break;case'edit-listing':formListing(find('listings'));break;case'delete-listing':confirmDelete('listings',id,'매물');break;case'price-listing':{let l=find('listings');if(!l)return;const value=prompt('변경된 매물 가격(원)',l.price);if(value===null)return;let n=Number(value);if(!Number.isFinite(n)||n<=0){notify('유효한 가격을 입력해 줘.');return}l.price=n;l.priceHistory=l.priceHistory||[];l.priceHistory.push({price:n,date:new Date().toISOString()});persist();render();break}case'status-listing':{let l=find('listings');if(!l)return;const opts=['판매중','예약중','판매완료','확인필요'];l.status=opts[(opts.indexOf(l.status)+1)%opts.length];persist();render();break}case'analyze-listing':{const l=find('listings');if(l)basicAnalysis(l);break}case'compare-listings':compareListings();break;case'add-service':formService();break;case'delete-service':confirmDelete('services',id,'정비 내역');break;case'add-fuel':formExpense(null,true);break;case'add-expense':formExpense();break;case'delete-expense':confirmDelete('expenses',id,'지출 내역');break;case'add-route':formRoute();break;case'edit-route':formRoute(find('routes'));break;case'delete-route':confirmDelete('routes',id,'코스');break;case'add-shop':formShop();break;case'edit-shop':formShop(find('shops'));break;case'delete-shop':confirmDelete('shops',id,'정비소');break;case'add-spec':formSpec();break;case'edit-spec':formSpec(find('specs'));break;case'delete-spec':confirmDelete('specs',id,'차종');break;case'nav-search':openExternalMap('naver',el('route-dest')?.value);break;case'kakao-search':openExternalMap('kakao',el('route-dest')?.value);break;case'find-shop-naver':openExternalMap('naver',el('shop-keyword')?.value);break;case'find-shop-kakao':openExternalMap('kakao',el('shop-keyword')?.value);break;case'start-gps':startGps();break;case'stop-gps':stopGps();break;case'export-gpx':download('motohub-ride.gpx',gpxFile(gps.points,'MOTO HUB 라이딩'),'application/gpx+xml');break;case'export-saved-gpx':{let r=find('routes');if(r?.points?.length)download('motohub-'+r.id+'.gpx',gpxFile(r.points,r.name),'application/gpx+xml');break}case'export-json':modal('전체 데이터 백업',`<div class="field-note" style="margin-bottom:12px">아래 내용을 전체 선택해 복사하고 메모장 등에 보관해. 앱 삭제 시 저장 기록도 사라질 수 있어.</div><textarea id="backupText" class="input" readonly style="height:48vh;white-space:pre;overflow:auto;font-size:12px">${esc(JSON.stringify(db,null,2))}</textarea><div class="item-foot">${btn('전체 선택','backup-select','','primary')}</div>`);break;case'backup-select':{const x=el('backupText');if(x){x.focus();x.select();try{document.execCommand('copy')}catch(_){ }notify('백업 문구를 선택했어. 복사해 보관해.')}break;}case'import-json':modal('데이터 복원',`<div class="field-note" style="margin-bottom:12px">이전에 복사해 둔 JSON 백업 전체를 아래에 붙여넣어.</div><textarea id="restoreText" class="input" style="height:40vh;white-space:pre;overflow:auto" placeholder="JSON 백업 내용을 붙여넣기"></textarea><div class="item-foot">${btn('붙여넣은 데이터 복원','restore-paste','','primary')}</div>`);break;case'restore-paste':{try{const obj=JSON.parse(el('restoreText').value);if(!obj||!['vehicles','watchlist','listings','services','expenses','shops','routes','specs'].every(k=>Array.isArray(obj[k])))throw Error('형식이 올바르지 않아.');if(confirm('현재 기록을 이 백업 내용으로 바꿀까?')){db=obj;persist();closeModal();render();notify('데이터 복원 완료')}}catch(err){alert('복원 실패: '+err.message)}break;}case'export-list-csv':download('motohub-listings.csv',csv([['차종','연식','가격','주행거리','지역','출처','퀵시프터','상태','링크','메모'],...db.listings.map(l=>[l.model,l.year,l.price,l.mileage,l.region,l.source,l.quick,l.status,l.url,l.notes])]),'text/csv;charset=utf-8');break;case'export-exp-csv':download('motohub-expenses.csv',csv([['종류','날짜','차량','항목','금액','주유량L','주행거리km'],...db.expenses.map(e=>['지출',e.date,findVehicle(e.vehicleId)?.name,e.title||e.type,e.amount,e.liters,e.mileage]),...db.services.map(s=>['정비',s.date,findVehicle(s.vehicleId)?.name,s.type,s.cost,'',s.mileage])]),'text/csv;charset=utf-8');break;case'reset-db':if(confirm('모든 바이크/매물/정비/코스 기록을 삭제할까? 이 작업은 되돌릴 수 없어.')){if(confirm('최종 확인: 백업하지 않은 모든 데이터가 사라져. 정말 삭제할까?')){db=demoData();compareSet.clear();specSet.clear();persist();render();notify('초기화했어.')}}break;default:break}}

  const oldMore=more;
  more=function(){normalize();if(moreView==='root'){
    let out=oldMore();const links=[['schedule','보험·정비 일정','예정일·주행거리 알림'],['check','출발 전 점검','9가지 점검표'],['stats','유지비·연비 통계','월별 비용과 주유 분석'],['gear','보호장비 수첩','헬멧·재킷·장갑 관리'],['updates','앱 업데이트','현재 버전·업데이트 확인']];
    const html=links.map(([id,name,desc])=>`<button class="v5-tools-link" data-action="more-tab" data-id="${id}"><span><strong>${name}</strong><small>${desc}</small></span><b>→</b></button>`).join('');
    return out.replace('<p class="v5-under-note">',html+'<p class="v5-under-note">');
  }
    if(moreView==='gear')return gearView();if(moreView==='schedule')return scheduleView();if(moreView==='check')return checkView();if(moreView==='stats')return statsView();if(moreView==='updates')return updateView();return oldMore().replace('안드로이드 개인용 1.0','안드로이드 개인용 2.0');
  };
  function pickBike(){const current=db.settings.activeBikeId||db.vehicles[0]?.id;modal('대표 바이크 선택',`<div class="v5-list">${db.vehicles.map(v=>`<button class="bike-option" data-action="set-active" data-id="${attr(v.id)}"><strong>${esc(v.name)}</strong><small>${fmt(v.odo)} km</small><span>${v.id===current?'선택됨':'선택'}</span></button>`).join('')}</div>`);}
  function formReminder(x){normalize();x=x||{};modal(x.id?'일정 수정':'보험·정비 일정 등록',`<div class="formgrid"><input type="hidden" name="id" value="${attr(x.id||'')}"><label><span class="label">바이크</span><select class="select" name="vehicleId"><option value="">공통</option>${db.vehicles.map(v=>`<option value="${attr(v.id)}" ${v.id===x.vehicleId?'selected':''}>${esc(v.name)}</option>`).join('')}</select></label>${f('일정 이름','title','text',x.title,{req:true,placeholder:'예: 보험 만기 / 엔진오일 교환'})}${f('날짜','date','date',x.date||'')}${f('예정 주행거리 (km)','nextKm','number',x.nextKm||'')}${f('메모','note','text',x.note||'',{full:true})}</div><div class="field-note">날짜 또는 예정 주행거리 중 하나 이상 입력해 줘. 앱 실행 중 확인 가능해.</div>`,'reminder');}
  function formGear(x){normalize();x=x||{};modal(x.id?'장비 수정':'보호장비 등록',`<div class="formgrid"><input type="hidden" name="id" value="${attr(x.id||'')}">${f('장비명','name','text',x.name,{req:true,placeholder:'예: 레빗 가죽 재킷'})}${f('분류','category','text',x.category||'헬멧/재킷/장갑')}${f('구매 날짜','bought','date',x.bought||'')}${f('구매 가격 (원)','price','number',x.price||'')}${f('사이즈·메모','note','text',x.note||'',{full:true})}</div>`,'gear');}
  function validHttps(x){try{const u=new URL(x);return u.protocol==='https:'?u.toString():''}catch(_){return ''}}
  async function checkRelease(manual=false){const url=validHttps(db.settings.updateManifest||'');if(!url){if(manual)alert('업데이트 서버 주소가 연결되지 않았어. 배포 주소를 입력해야 확인할 수 있어.');return}
    try{const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),8500);
      const response=await fetch(url,{cache:'no-store',signal:ctl.signal});clearTimeout(timer);
      if(!response.ok)throw Error('HTTP '+response.status);
      const obj=await response.json();if(!Number.isInteger(obj.versionCode)||!validHttps(obj.apkUrl||''))throw Error('버전 JSON 형식 오류');
      db.settings.lastReleaseCheck=dateNow();persist();
      if(obj.versionCode>RELEASE_VERSION){const uri=validHttps(obj.apkUrl);modal('새 버전 '+esc(obj.versionName||String(obj.versionCode)),`<p>새 버전이 등록됐어. 아래 주소를 복사해 크롬에서 열고 APK를 설치하면 돼. 안드로이드 설치 승인이 필요해.</p><textarea class="input" id="apkLink" readonly rows="3">${esc(uri)}</textarea><button class="wide-add" data-action="copy-apk">다운로드 주소 복사</button><p class="v5-inline-warning">현재 앱 데이터가 중요하면 업데이트 전에 JSON 백업을 먼저 해 둬.</p>`);
      }else if(manual)notify('현재 앱이 최신 버전이야 (등록된 서버 기준)');
    }catch(e){if(manual)alert('버전 확인 실패: '+e.message+'\n주소·HTTPS·서버 CORS 허용 여부를 확인해 줘.');}
  }
  const prevHandle=handleAction;
  handleAction=function(action,id){normalize();switch(action){
    case 'gps-unavailable':alert('이 개인용 APK의 로컬 WebView는 GPS 위치 권한이 연결되어 있지 않아. 라이딩 코스는 직접 저장할 수 있고, 향후 네이티브 GPS 권한을 연결한 버전에서 지원할 예정이야.');return;
    case 'select-bike':pickBike();return;
    case 'set-active':db.settings.activeBikeId=id;persist();closeModal();render();return;
    case 'add-reminder':formReminder();return;
    case 'edit-reminder':formReminder(db.reminders.find(x=>x.id===id));return;
    case 'delete-reminder':if(confirm('일정을 삭제할까?')){db.reminders=db.reminders.filter(x=>x.id!==id);persist();render();}return;
    case 'add-gear':formGear();return;
    case 'edit-gear':formGear(db.gear.find(x=>x.id===id));return;
    case 'delete-gear':if(confirm('장비 기록을 삭제할까?')){db.gear=db.gear.filter(x=>x.id!==id);persist();render()}return;
    case 'reset-check':if(confirm('출발 점검 항목을 전부 초기화할까?')){db.settings.preRide={};persist();render()}return;
    case 'save-release':{const u=el('release-manifest')?.value.trim()||'',p=el('release-page')?.value.trim()||'';if((u&&!validHttps(u))||(p&&!validHttps(p))){notify('HTTPS 주소만 등록할 수 있어.');return}db.settings.updateManifest=u;db.settings.releasePage=p;persist();notify('주소 저장 완료');return;}
    case 'check-release':checkRelease(true);return;
    case 'copy-apk':{const x=el('apkLink');if(x){x.focus();x.select();try{document.execCommand('copy');notify('링크를 복사했어. 크롬에 붙여넣어 줘.')}catch(_){notify('링크를 길게 눌러 복사해 줘.')}}return;}
    case 'more-tab':moreView=id;tab='more';render();window.scrollTo(0,0);return;
    default:return prevHandle(action,id);
  }};
  // Capture newly added controls before the original broad form handler.
  document.addEventListener('submit',(event)=>{
    const form=event.target;
    if(!form.matches('[data-form="reminder"], [data-form="gear"]'))return;
    event.preventDefault();event.stopImmediatePropagation();
    const values=Object.fromEntries(new FormData(form).entries());const formType=form.dataset.form;
    if(formType==='reminder'){
      if(!values.date&&!values.nextKm){notify('날짜 또는 주행거리를 입력해 줘.');return}
      const r={id:values.id||uid(),title:values.title.trim(),vehicleId:values.vehicleId||'',date:values.date||'',nextKm:Number(values.nextKm)||0,note:values.note||''};
      const old=db.reminders.findIndex(x=>x.id===r.id);if(old>=0)db.reminders[old]=r;else db.reminders.push(r);
    }else{
      const g={id:values.id||uid(),name:values.name.trim(),category:values.category.trim(),bought:values.bought||'',price:Number(values.price)||0,note:values.note||''};const old=db.gear.findIndex(x=>x.id===g.id);if(old>=0)db.gear[old]=g;else db.gear.push(g);
    }
    persist();closeModal();render();notify('저장했어.');
  },true);
  document.addEventListener('change',(event)=>{
    const id=event.target?.dataset?.precheck;if(!id)return;
    db.settings.preRide[id]=event.target.checked;persist();
    const count=checkItems.filter(([s])=>db.settings.preRide[s]).length;
    const n=document.querySelector('.check-progress strong');if(n)n.textContent=`${count} / ${checkItems.length}`;
    const meter=document.querySelector('.meter i');if(meter)meter.style.width=(count*100/checkItems.length)+'%';
  });
  const oldExport=handleAction;
  handleAction=function(action,id){ // Backups now include extras as standard db fields.
    return oldExport(action,id);
  };
  normalize();render();
  if(db.settings.updateManifest){ // Only check at startup if user explicitly configured an update server.
    checkRelease(false);
  }
})();
</script>

  const isCub=b=>!!b&&/(슈퍼커브|슈퍼컵|super[\s_-]*cub)/i.test(b.name||'');
  const bikeArt=b=>b?.garagePhoto || (isCub(b)?cubArt:neutralArt);
  home=function(){
    const bike=getBike(); const alertList=dueServices();
    const due=alertList.filter(x=>x.deltaKm!==null).sort((a,b)=>a.deltaKm-b.deltaKm)[0];
    const odometer=bike?Number(bike.odo||0):0;
    const month=dateNow().slice(0,7); const rideCount=(db.routes||[]).filter(x=>(x.date||'').startsWith(month)).length;
    const listings=(db.listings||[]).filter(x=>x.status!=='판매완료').slice().sort((a,b)=>(b.created||'').localeCompare(a.created||'')).slice(0,2);
    const rec=[...(db.services||[]).map(x=>({label:x.type||'정비',date:x.date,value:x.cost||0})),...(db.expenses||[]).map(x=>({label:x.type||'지출',date:x.date,value:x.amount||0}))].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
    const pending=alertList.some(x=>x.overdue);
    const status =!bike?'바이크 등록 필요':!alertList.length?'정비 주기 미등록':pending?'정비 확인 필요':'정비 일정 확인됨';
    return `<div class="g-home"><div class="g-top"><div><div class="g-wordmark">MOTO HUB</div><div class="g-title">MY GARAGE</div><div class="g-tagline">RIDE · RECORD · MAINTAIN</div></div><div class="g-top-actions"><button class="g-icon" data-action="nav" data-id="more" aria-label="더보기">☷</button><button class="g-icon" data-action="nav" data-id="more" aria-label="설정">⚙</button></div></div>
     <section class="g-hero"><div class="g-photo" style="background-image:linear-gradient(0deg,rgba(5,12,16,.88),transparent 64%),url('${bikeArt(bike)}')"><div class="g-badge">MY BIKE</div><button type="button" class="g-photo-change" data-action="change-bike-photo" aria-label="바이크 사진 변경">사진 변경</button><div class="g-photo-name"><div class="g-bike-title">${bike?safe(bike.name):'내 바이크를 등록해 줘'}</div><div class="g-bike-info">${bike?(bike.year?safe(bike.year)+'년식 · ':'')+'내 바이크 · '+(bike.garagePhoto?'내 사진':isCub(bike)?'슈퍼커브 참고 이미지':'사진 미등록'):'차고 탭에서 추가 가능'}</div></div></div>
     <span class="g-state ${pending||!alertList.length?'warn':''}">● ${safe(status)}</span>
     <div class="g-stats"><div class="g-stat"><span class="g-stat-ico">◈</span><span class="g-stat-strong">${fmt(odometer)}<small> km</small></span><span class="g-stat-label">누적 주행거리</span></div><div class="g-stat"><span class="g-stat-ico">⚒</span><span class="g-stat-strong">${due?fmt(Math.max(0,due.deltaKm)):'—'}<small>${due?' km':''}</small></span><span class="g-stat-label">다음 정비까지</span></div><div class="g-stat"><span class="g-stat-ico">▥</span><span class="g-stat-strong">${fmt(rideCount)}<small> 회</small></span><span class="g-stat-label">이번 달 기록</span></div></div></section>
     <button class="g-ride" data-action="nav" data-id="ride">➤ &nbsp;라이딩 시작 &nbsp;›</button>
     <div class="g-actions"><button class="g-action" data-action="add-fuel"><span class="g-glyph">⛽</span><strong>주유 기록</strong><small>연비 · 비용</small></button><button class="g-action" data-action="add-service"><span class="g-glyph">⚒</span><strong>정비 기록</strong><small>교체 · 알림</small></button><button class="g-action" data-action="nav" data-id="ride"><span class="g-glyph">▤</span><strong>라이딩 기록</strong><small>GPS · 코스</small></button></div>
     <div class="g-section-head"><strong>저장한 매물</strong><button data-action="nav" data-id="listings">모두 보기 ›</button></div>
     ${listings.length?listings.map(x=>`<button class="g-entry" data-action="nav" data-id="listings"><div><strong>${safe(x.model||x.name||'바이크 매물')}</strong><small>${x.year?safe(x.year)+'년 · ':''}${x.km?fmt(x.km)+' km':'저장된 매물'}</small></div><span class="g-orange">${x.price?fmt(x.price)+'원':'가격 미등록'}</span></button>`).join(''):'<div class="g-empty">저장한 매물이 없어.<br>매물 탭에서 관심 바이크를 추가할 수 있어.</div>'}
     <div class="g-section-head"><strong>친구 & 그룹 라이딩</strong><button data-action="nav" data-id="ride">라이딩 ›</button></div><div class="g-friend"><span>♧</span><div><strong>라이딩 코스와 기록</strong><small>친구·그룹 실시간 GPS는 네이티브 앱에서만 지원돼.</small></div></div>
     <div class="g-section-head"><strong>최근 기록</strong><button data-action="nav" data-id="garage">전체 보기 ›</button></div>
     ${rec?`<button class="g-entry" data-action="nav" data-id="garage"><div><strong>${safe(rec.label)}</strong><small>${safe(rec.date||'')}</small></div><span class="g-orange">${fmt(rec.value)}원</span></button>`:'<div class="g-empty">아직 기록이 없어. 위 바로가기에서 주유·정비를 추가해 봐.</div>'}
     <div class="g-notice">브라우저 버전: 정비·매물·주유·개인 전경 GPS·백업 가능. 친구·그룹 GPS와 백그라운드 GPS는 Android 네이티브 앱 전용.</div></div>`;
  };
  // Add per-bike photo selection. Imported photos are resized before local storage.
  const photoPicker=document.createElement('input');photoPicker.type='file';photoPicker.accept='image/*';photoPicker.style.display='none';document.body.appendChild(photoPicker);
  document.addEventListener('click',e=>{const button=e.target.closest('[data-action="change-bike-photo"]');if(!button)return;e.preventDefault();e.stopImmediatePropagation();if(!getBike()){notify('바이크부터 등록해 줘.');return;}photoPicker.click();},true);
  photoPicker.addEventListener('change',async()=>{const f=photoPicker.files?.[0];if(!f)return;
    if(!f.type.startsWith('image/')||f.size>15*1024*1024){notify('15MB 이하 이미지로 선택해 줘.');return;}
    try{const bitmap=await createImageBitmap(f);const factor=Math.min(1,1024/bitmap.width,680/bitmap.height);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*factor));canvas.height=Math.max(1,Math.round(bitmap.height*factor));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const b=getBike();b.garagePhoto=canvas.toDataURL('image/jpeg',.72);persist();render();notify('내 바이크 사진으로 변경했어.');}
    catch(_){notify('사진을 적용하지 못했어. 지원되는 사진을 골라 줘.');}finally{photoPicker.value='';}

  render();
