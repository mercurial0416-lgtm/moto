name: UX53 direct-install signed APK (private artifact)
on:
  push:
    branches: ['feat/ux53-apk-one-tap-idle-safety-20261027']
    paths:
      - 'MOTO-HUB/**'
      - '.github/workflows/ux53-fixed-apk-direct.yml'
permissions:
  contents: read
jobs:
  safe-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 36
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Refuse build without original fixed-key secrets
        shell: bash
        env:
          STORE_B64: ${{ secrets.MOTO_SIGNING_STORE_B64 }}
          STORE_PASS: ${{ secrets.MOTO_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOTO_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MOTO_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || {
            echo "::error::Original signing secrets missing: cannot safely replace installed APK"
            exit 1
          }
          umask 077
          printf '%s' "$STORE_B64" | base64 -d > "$RUNNER_TEMP/moto-ux53-existing.p12"
      - name: Test and build DIRECT APK only (not Play)
        working-directory: MOTO-HUB
        env:
          MOTO_SIGNING_STORE_FILE: ${{ runner.temp }}/moto-ux53-existing.p12
          MOTO_SIGNING_STORE_PASSWORD: ${{ secrets.MOTO_SIGNING_STORE_PASSWORD }}
          MOTO_SIGNING_KEY_ALIAS: ${{ secrets.MOTO_SIGNING_KEY_ALIAS }}
          MOTO_SIGNING_KEY_PASSWORD: ${{ secrets.MOTO_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:lintDebug :app:testDebugUnitTest -PmotoReleaseCode=523 --no-daemon
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          SHA=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          EXPECTED=212c5b39d0082ab4bed78f8da2b719819cd80a20bc116c84f8bdfabca507021b
          test "$SHA" = "$EXPECTED" || { echo "::error::Signing certificate mismatch: no APK published"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.motohub.next'" | grep -F "versionCode='523'"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "versionName='4.0.0-alpha6-di.523'"; then
            echo "Original identity and monotonic version verified"
          fi
          sha256sum "$APK" > app/build/outputs/apk/release/SHA256.txt
          printf '%s\n' "$SHA" > app/build/outputs/apk/release/cert-sha256.txt
      - name: Upload same-signer APK for private download
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-HUB-UX53-523-DIRECT-FIXED-SIGNED
          path: |
            MOTO-HUB/app/build/outputs/apk/release/app-release.apk
            MOTO-HUB/app/build/outputs/apk/release/SHA256.txt
            MOTO-HUB/app/build/outputs/apk/release/cert-sha256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Scrub fixed key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/moto-ux53-existing.p12"
