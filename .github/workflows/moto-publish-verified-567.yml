name: Publish verified offline-signed MOTO HUB v567 OTA (no private key in GitHub)
on:
  push:
    branches: ['release/moto-hub-apk']
    paths:
      - '.github/verified-release/567.patch.zst.b64'
      - '.github/workflows/moto-publish-verified-567.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: moto-fixed-signed-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/moto-hub-apk
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: release-meta
          persist-credentials: true
      - name: Pin tested v567 source and public manifest
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < MOTO-HUB/release-code.txt)" = 567
          # The checked unsigned APK was built from the exact v567 source tree
          # (PR #127 verified head 96667031; release squash 80c78631).
          git diff --quiet 80c78631468744c675e9695fbda114acf120beae HEAD -- MOTO-HUB/app MOTO-HUB/release-code.txt
          test "$(git rev-parse 80c78631468744c675e9695fbda114acf120beae^{tree})" = 85b9845e88a43d7035d261425892068d14c42140
          CURRENT=$(python3 -c 'import json;print(int(json.load(open("release-meta/updates/manifest.json"))["versionCode"]))')
          test "$CURRENT" -lt 567 || { echo "::error::Published version already 567 or newer"; exit 1; }
      - name: Retrieve exact CI-generated unsigned v567 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13084135715/zip" > "$RUNNER_TEMP/unsigned-archive.zip"
          unzip -tq "$RUNNER_TEMP/unsigned-archive.zip"
          unzip -p "$RUNNER_TEMP/unsigned-archive.zip" 'apk/release/app-release-unsigned.apk' > "$RUNNER_TEMP/unsigned-v567.apk"
          echo '8971bf7ee7dcbc80cc1609c7c7122d6266ec7bd58a68f293f643ffe0ec59b88a  '"$RUNNER_TEMP/unsigned-v567.apk" | sha256sum -c -
      - name: Recover exactly locally signed, certificate-bound APK
        run: |
          set -euo pipefail
          base64 --decode < .github/verified-release/567.patch.zst.b64 > "$RUNNER_TEMP/v567.patch.zst"
          echo '2607352401ae4de12ddfca34dd014b060234e91c18553458e4596f4cfec758b4  '"$RUNNER_TEMP/v567.patch.zst" | sha256sum -c -
          zstd -q -d --patch-from="$RUNNER_TEMP/unsigned-v567.apk" "$RUNNER_TEMP/v567.patch.zst" -o "$RUNNER_TEMP/MOTO-HUB.apk"
          echo 'faa7e9542ea98859c25791fb4afeeb315b6a5074ec37d5b150937480e37d61ad  '"$RUNNER_TEMP/MOTO-HUB.apk" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/MOTO-HUB.apk"
      - name: Verify Android v567, package and original signer (no key exposed)
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$SIGNER" verify --min-sdk-version 26 --verbose --print-certs "$RUNNER_TEMP/MOTO-HUB.apk" > "$RUNNER_TEMP/signature.txt"
          grep -Fqx 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          grep -Fqx 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/signature.txt"
          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test "$CERT" = 212c5b39d0082ab4bed78f8da2b719819cd80a20bc116c84f8bdfabca507021b || { echo "::error::Original signer mismatch"; exit 1; }
          "$AAPT" dump badging "$RUNNER_TEMP/MOTO-HUB.apk" | grep -F "package: name='com.motohub.next' versionCode='567'"
          test "$(sha256sum "$RUNNER_TEMP/MOTO-HUB.apk" | cut -d' ' -f1)" = faa7e9542ea98859c25791fb4afeeb315b6a5074ec37d5b150937480e37d61ad
      - name: Publish v567 asset, then advance the existing OTA manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode | python3 -c 'import json,sys;print(json.load(sys.stdin)["versionCode"])')
          test "$CURRENT" -lt 567 || { echo "::error::Manifest has already advanced"; exit 1; }
          TAG=moto-hub-v567
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Existing v567 release requires manual inspection; refusing overwrite"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-v567"
          cp "$RUNNER_TEMP/MOTO-HUB.apk" "$RUNNER_TEMP/release-v567/MOTO-HUB.apk"
          gh release create "$TAG" "$RUNNER_TEMP/release-v567/MOTO-HUB.apk" --repo "$GITHUB_REPOSITORY" --target 80c78631468744c675e9695fbda114acf120beae --title 'MOTO HUB 567 (original signed)' --notes 'Offline original-key signature verified. In-app update preserves compatible installed application data.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'MOTO-HUB.apk'
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/MOTO-HUB.apk"
          python3 MOTO-HUB/tools/make_update_manifest.py --apk "$RUNNER_TEMP/MOTO-HUB.apk" --apk-url "$URL" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --output "$RUNNER_TEMP/manifest-v567.json"
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1])); assert d["versionCode"]==567; assert d["packageName"]=="com.motohub.next"; assert d["certificateSha256"]=="212c5b39d0082ab4bed78f8da2b719819cd80a20bc116c84f8bdfabca507021b"' "$RUNNER_TEMP/manifest-v567.json"
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json?ref=main" --jq .sha)
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode | python3 -c 'import json,sys;print(json.load(sys.stdin)["versionCode"])')
          test "$LATEST" -lt 567 || { echo "::error::Concurrent newer manifest; refusing overwrite"; exit 1; }
          PAYLOAD=$(base64 --wrap=0 "$RUNNER_TEMP/manifest-v567.json")
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json" -f branch=main -f sha="$SHA" -f content="$PAYLOAD" -f message="Publish verified original-signed MOTO HUB v567 OTA"
          echo 'v567 original-signed OTA published in main/updates/manifest.json'
