name: UX110 branch full regression + compilation
on:
  push:
    branches: ['feat/moto-v572-ui-overhaul-20261102']
    paths: ['MOTO-HUB/**', '.github/workflows/moto-ux110-aggregate-check.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run ALL source and pure-Java regression suites (collect every failure)
        working-directory: MOTO-HUB
        run: |
          set -uo pipefail
          curl --fail --location --retry 3 --retry-all-errors -o "$RUNNER_TEMP/json.jar" "https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar"
          export JSON_JAR="$RUNNER_TEMP/json.jar"
          failures=0
          for suite in tests/run-*.sh; do
            echo "::group::$suite"
            if bash "$suite"; then echo "PASS $suite"; else echo "::error::FAILED $suite"; failures=$((failures+1)); fi
            echo "::endgroup::"
          done
          for suite in tests/test_workshop_ui.py tests/test_readable_ui.py tests/test_alpha6_dc_integration.py; do
            if python3 "$suite"; then echo "PASS $suite"; else echo "::error::FAILED $suite"; failures=$((failures+1)); fi
          done
          echo "FULL REGRESSION FAILED SUITES=$failures"
          test "$failures" -eq 0
      - name: Android compilation, lint and instrumentation unit tests
        if: always()
        working-directory: MOTO-HUB
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest -PmotoReleaseCode=572 --no-daemon
      - name: Archive unsigned APK for offline original-certificate signing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moto-ui110-unsigned-${{ github.sha }}
          path: MOTO-HUB/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
