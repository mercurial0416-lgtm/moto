name: MOTO HUB OBD read-only preview APK
on:
  workflow_dispatch:
  push:
    branches: [feat/obd-readonly-pid-discovery-20261108]
    paths:
      - 'MOTO-HUB/**'
      - '.github/workflows/moto-obd-preview.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build isolated OBD preview with unit tests
        working-directory: MOTO-HUB
        run: |
          chmod +x gradlew
          # Official Gradle GitHub release redirect is returning HTTP 504.
          # Use an independent mirror only with Gradle's official SHA-256 hard-pinned.
          sed -i 's#https\\://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip#https\\://mirrors.aliyun.com/gradle/distributions/v8.11.1/gradle-8.11.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          printf '%s\n' 'distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' >> gradle/wrapper/gradle-wrapper.properties
          ./gradlew :app:assembleObdPreview :app:testObdPreviewUnitTest -PmotoReleaseCode=587 --no-daemon --stacktrace
      - name: Verify separate package and APK signature
        working-directory: MOTO-HUB
        run: |
          APK="app/build/outputs/apk/obdPreview/app-obdPreview.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.motohub.next.obdpreview' versionCode='587'"
          sha256sum "$APK" > "app/build/outputs/apk/obdPreview/SHA256.txt"
      - name: Upload APK (test only, not an update over MOTO HUB)
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-HUB-OBD-PREVIEW-587
          path: |
            MOTO-HUB/app/build/outputs/apk/obdPreview/app-obdPreview.apk
            MOTO-HUB/app/build/outputs/apk/obdPreview/SHA256.txt
          if-no-files-found: error
          retention-days: 14
