name: MOTO HUB v588 existing-install signed canary
on:
  workflow_dispatch:
  push:
    branches: [feat/obd-readonly-pid-discovery-20261108]
    paths:
      - '.github/workflows/moto-v588-signed-canary.yml'
permissions:
  contents: read
jobs:
  signed-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check original signing certificate availability
        env:
          KEYSTORE_B64: ${{ secrets.MOTO_SIGNING_STORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOTO_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOTO_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOTO_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Original keystore secrets are unavailable. Do not publish a replacement signer."; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/moto-fixed.p12"
          test -s "$RUNNER_TEMP/moto-fixed.p12"
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build release APK with fixed signature (no publication)
        env:
          MOTO_SIGNING_STORE_FILE: ${{ runner.temp }}/moto-fixed.p12
          MOTO_SIGNING_STORE_PASSWORD: ${{ secrets.MOTO_SIGNING_STORE_PASSWORD }}
          MOTO_SIGNING_KEY_ALIAS: ${{ secrets.MOTO_SIGNING_KEY_ALIAS }}
          MOTO_SIGNING_KEY_PASSWORD: ${{ secrets.MOTO_SIGNING_KEY_PASSWORD }}
        working-directory: MOTO-HUB
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:testReleaseUnitTest -PmotoReleaseCode=588 --no-daemon
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test "$CERT" = '212c5b39d0082ab4bed78f8da2b719819cd80a20bc116c84f8bdfabca507021b'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "package: name='com.motohub.next' versionCode='588'"
          sha256sum "$APK" > app/build/outputs/apk/release/SHA256.txt
      - name: Publish private CI artifact only (no OTA manifest)
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-HUB-v588-ORIGINAL-SIGNED-CANARY
          path: |
            MOTO-HUB/app/build/outputs/apk/release/app-release.apk
            MOTO-HUB/app/build/outputs/apk/release/SHA256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Delete temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/moto-fixed.p12"
