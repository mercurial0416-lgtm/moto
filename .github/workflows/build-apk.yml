name: Build MOTO HUB Alpha6-AB APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'MOTO-HUB-4.0.0-alpha6-ab-source.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Extract source checkpoint
        run: |
          test -f MOTO-HUB-4.0.0-alpha6-ab-source.zip
          unzip -q MOTO-HUB-4.0.0-alpha6-ab-source.zip
          test -f MOTO-HUB/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          echo "y" | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: MOTO-HUB
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-HUB-Alpha6-AB-APK
          path: MOTO-HUB/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
