name: Validate and build MOTO HUB
on:
  workflow_dispatch:
  push:
    branches-ignore: ['build/di518-prebuild-20261020', 'build/di518-ux4-prebuild-20261020', 'fix/di518-ux5-record-stability-20261020', 'fix/di518-ux6-reliability-20261020', 'fix/di518-ux7-photo-ride-recovery-20261020', 'fix/di518-ux8-gps-photo-update-safety-20261020', 'fix/di518-ux9-last-mile-20261020', 'fix/di518-ux10-ride-backup-edgecases-20261020', 'fix/di518-ux11-backup-retention-20261020', 'fix/di518-ux12-valid-backup-content-20261021', 'fix/di518-ux13-backup-cache-20261021', 'design/di518-ux14-native-polish-20261021', 'feat/di518-ux16-quickfuel-maintenance-20261022', 'feat/di518-ux17-service-loop-20261022']
    paths: ['MOTO-HUB/**', '.github/workflows/build-apk.yml']
  pull_request:
    branches: ['main']
    paths: ['MOTO-HUB/**', '.github/workflows/build-apk.yml']
permissions:
  contents: read
concurrency:
  group: moto-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pure Java regression tests
        working-directory: MOTO-HUB
        run: |
          JSON_PATH="org/json/json/20240303/json-20240303.jar"
          if ! curl --fail --location --retry 3 --retry-all-errors -o "$RUNNER_TEMP/json.jar" "https://repo.maven.apache.org/maven2/$JSON_PATH"; then
            curl --fail --location --retry 3 --retry-all-errors -o "$RUNNER_TEMP/json.jar" "https://repo1.maven.org/maven2/$JSON_PATH"
          fi
          test -s "$RUNNER_TEMP/json.jar"
          export JSON_JAR="$RUNNER_TEMP/json.jar"
          failures=0
          for test in tests/run-*.sh; do
            echo "::group::${test}"
            if bash "$test"; then
              echo "PASS ${test}"
            else
              echo "::error title=Regression failed::${test}"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          if ! python3 tests/test_alpha6_dc_integration.py; then
            echo "::error title=Regression failed::tests/test_alpha6_dc_integration.py"
            failures=$((failures+1))
          fi
          echo "Total failed suites: ${failures}"
          test "$failures" -eq 0
      - name: Build, lint and unit tests (no backend requests)
        working-directory: MOTO-HUB
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --no-daemon
      - name: APK signature and checksum
        working-directory: MOTO-HUB
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "versionCode='518'" > app/build/outputs/apk/debug/version-check.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256.txt
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-HUB-DEBUG-TEST-ONLY-${{ github.sha }}
          path: |
            MOTO-HUB/app/build/outputs/apk/debug/
            MOTO-HUB/app/build/reports/
            MOTO-HUB/app/build/test-results/
          if-no-files-found: warn
