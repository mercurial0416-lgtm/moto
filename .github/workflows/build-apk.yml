name: Validate and build MOTO HUB
on:
  workflow_dispatch:
  push:
    paths: ['MOTO-HUB/**', '.github/workflows/build-apk.yml']
  pull_request:
    paths: ['MOTO-HUB/**', '.github/workflows/build-apk.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pure Java regression tests
        working-directory: MOTO-HUB
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/json.jar" https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          export JSON_JAR="$RUNNER_TEMP/json.jar"
          for test in tests/run-*.sh; do bash "$test"; done
          python3 tests/test_alpha6_dc_integration.py
      - name: Build, lint and unit tests (no backend requests)
        working-directory: MOTO-HUB
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --no-daemon
      - name: APK signature and checksum
        working-directory: MOTO-HUB
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "versionCode='514'" > app/build/outputs/apk/debug/version-check.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256.txt
      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-HUB-DE514-${{ github.sha }}
          path: |
            MOTO-HUB/app/build/outputs/apk/debug/
            MOTO-HUB/app/build/reports/
            MOTO-HUB/app/build/test-results/
          if-no-files-found: warn
