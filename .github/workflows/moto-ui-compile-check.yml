name: MOTO HUB UI-only compile check
on:
  push:
    branches:
      - design/bariweekend-inspired-ui-20261102
    paths:
      - 'MOTO-HUB/**'
      - '.github/workflows/moto-ui-compile-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile and test native Android UI (debug only, no release/signing)
        working-directory: MOTO-HUB
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac :app:lintDebug :app:testDebugUnitTest --no-daemon
