name: MOTO HUB UX integration validation
on:
  pull_request:
    paths:
      - 'MOTO-HUB/**'
      - '.github/workflows/moto-ux-validation.yml'
  push:
    branches:
      - 'fix/ux43-stability-forms-cancel-20261025'
      - 'feat/ux44-obd-first-connection-20261025'
      - 'feat/ux45-obd-reliability-diagnostics-20261025'
      - 'feat/ux46-ride-maintenance-reliability-20261026'
      - 'release/ux47-apk-safe-update-20261026'
      - 'feat/ux48-stability-release-hardening-20261026'
      - 'feat/ux49-multinav-play-store-ready-20261026'
      - 'feat/ux50-52-navigation-ride-release-20261026'
permissions:
  contents: read
concurrency:
  group: moto-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  android-debug-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android build prerequisites
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run all UX pure Java and source regressions
        working-directory: MOTO-HUB
        run: |
          set -euo pipefail
          python3 tests/test_workshop_ui.py
          python3 tests/test_readable_ui.py
          bash tests/run-ux40-update-policy-tests.sh
          bash tests/run-ux41-update-progress-tests.sh
          bash tests/run-ux42-update-integrity-tests.sh
          bash tests/run-ux43-stability-tests.sh
          bash tests/run-ux44-obd-connect-tests.sh
          bash tests/run-ux45-obd-stability-tests.sh
          bash tests/run-ux46-ride-maintenance-tests.sh
          bash tests/run-ux48-stability-tests.sh
          bash tests/run-ux49-navigation-play-tests.sh
          bash tests/run-ux50-52-navigation-ride-release-tests.sh
          bash tests/run-ux54-native-widget-tests.sh
          bash tests/run-ux55-stability-tests.sh
          bash tests/run-ux56-reliability-tests.sh
          bash tests/run-ux57-quality-tests.sh
          bash tests/run-ux58-nav-and-reliability-tests.sh
          bash tests/run-ux59-widget-and-nav-tests.sh
          bash tests/run-ux60-no-giant-widgets-tests.sh
          bash tests/run-ux61-simplified-ui-tests.sh
          bash tests/run-ux62-simplify-tabs-and-ride.sh
          bash tests/run-ux63-recovery-resume-tests.sh
          bash tests/run-ux64-home-nav-tests.sh
          bash tests/run-ux65-navigation-resume-tests.sh
          bash tests/run-ux66-nav-focus-backup-tests.sh
          bash tests/run-ux67-widget-maintenance-tests.sh
          bash tests/run-ux69-safety-and-release-tests.sh
          bash tests/run-ux70-integrity-and-shortcuts.sh
          bash tests/run-ux71-compact-recovery-tests.sh
          bash tests/run-ux72-backup-restore-tests.sh
          bash tests/run-ux73-ui-backup-tests.sh
          bash tests/run-ux74-search-stability-tests.sh
          bash tests/run-ux76-stability-tests.sh
          bash tests/run-ux77-final-ux-tests.sh
          bash tests/run-ux78-registration-cleanup-tests.sh
          bash tests/run-ux79-daily-convenience-tests.sh
          bash tests/run-ux80-daily-precision-tests.sh
          bash tests/run-ux81-everyday-fixes-tests.sh
          bash tests/run-ux82-practical-upgrades.sh
          bash tests/run-ux83-stabilization-tests.sh
          bash tests/run-ux86-data-safety-tests.sh
          bash tests/run-ux87-data-recovery-tests.sh
          bash tests/run-ux88-backup-search-restore-tests.sh
          bash tests/run-ux89-release-stability-tests.sh
          bash tests/run-ux90-ota-and-upgrade-tests.sh
      - name: Full legacy and current pure Java regression gate
        working-directory: MOTO-HUB
        run: |
          set -euo pipefail
          JSON_PATH="org/json/json/20240303/json-20240303.jar"
          if ! curl --fail --location --retry 3 --retry-all-errors -o "$RUNNER_TEMP/json.jar" "https://repo.maven.apache.org/maven2/$JSON_PATH"; then
            curl --fail --location --retry 3 --retry-all-errors -o "$RUNNER_TEMP/json.jar" "https://repo1.maven.org/maven2/$JSON_PATH"
          fi
          test -s "$RUNNER_TEMP/json.jar"
          export JSON_JAR="$RUNNER_TEMP/json.jar"
          failures=0
          for script in tests/run-*.sh; do
            echo "::group::$script"
            if bash "$script"; then
              echo "PASS $script"
            else
              echo "::error title=Regression failed::$script"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          if ! python3 tests/test_alpha6_dc_integration.py; then
            echo "::error title=Regression failed::tests/test_alpha6_dc_integration.py"
            failures=$((failures+1))
          fi
          echo "Total failed suites: $failures"
          test "$failures" -eq 0
      - name: Compile Android application and run lint and unit tests
        working-directory: MOTO-HUB
        run: |
          set -euo pipefail
          CODE="$(tr -d '[:space:]' < release-code.txt)"
          [[ "$CODE" =~ ^[0-9]{3,4}$ ]] || { echo "Invalid release code"; exit 1; }
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:assemblePlayRelease :app:bundlePlayRelease :app:lintDebug :app:testDebugUnitTest -PmotoReleaseCode="$CODE" --no-daemon --stacktrace
      - name: Verify APK build outputs (signing happens outside CI)
        working-directory: MOTO-HUB
        run: |
          set -euo pipefail
          CODE="$(tr -d '[:space:]' < release-code.txt)"
          [[ "$CODE" =~ ^[0-9]{3,4}$ ]] || { echo "Invalid release code"; exit 1; }
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | grep -F "versionCode='$CODE'"
          aab=$(find app/build/outputs/bundle/playRelease -maxdepth 1 -type f -name '*.aab' -print -quit)
          apk=$(find app/build/outputs/apk/playRelease -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$aab" && test -s "$aab"
          test -n "$apk" && test -s "$apk"
          cp "$aab" app/build/outputs/bundle/playRelease/MOTO-HUB-play-$CODE.aab
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "versionCode='$CODE'"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES'; then
            echo "Google Play variant must not request APK installation permission"
            exit 1
          fi
          for pkg in com.nhn.android.nmap com.skt.tmap.ku; do
            grep -Fq "$pkg" app/src/main/AndroidManifest.xml || exit 1
          done
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > app/build/outputs/apk/release/SHA256-unsigned.txt
      - name: Archive unsigned release for private offline fixed signing
        uses: actions/upload-artifact@v4
        with:
          name: moto-ux76-unsigned-release-and-play-aab-${{ github.sha }}
          path: |
            MOTO-HUB/app/build/outputs/apk/release/app-release-unsigned.apk
            MOTO-HUB/app/build/outputs/apk/release/SHA256-unsigned.txt
            MOTO-HUB/app/build/outputs/bundle/playRelease/MOTO-HUB-play-*.aab
          if-no-files-found: error
          retention-days: 7
      - name: Archive build verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moto-ux76-test-reports
          path: |
            MOTO-HUB/app/build/reports/
            MOTO-HUB/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
# Debug build verifies compilation only. It is NOT fixed-signed and MUST NOT
# replace an installed user APK. Verified release workflow remains separate.
