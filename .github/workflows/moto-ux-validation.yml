name: MOTO HUB UX integration validation
on:
  pull_request:
    paths:
      - 'MOTO-HUB/**'
      - '.github/workflows/moto-ux-validation.yml'
  push:
    branches:
      - 'fix/ux43-stability-forms-cancel-20261025'
      - 'feat/ux44-obd-first-connection-20261025'
      - 'feat/ux45-obd-reliability-diagnostics-20261025'
      - 'feat/ux46-ride-maintenance-reliability-20261026'
      - 'release/ux47-apk-safe-update-20261026'
permissions:
  contents: read
jobs:
  android-debug-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android build prerequisites
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run all UX pure Java and source regressions
        working-directory: MOTO-HUB
        run: |
          set -euo pipefail
          python3 tests/test_workshop_ui.py
          python3 tests/test_readable_ui.py
          bash tests/run-ux40-update-policy-tests.sh
          bash tests/run-ux41-update-progress-tests.sh
          bash tests/run-ux42-update-integrity-tests.sh
          bash tests/run-ux43-stability-tests.sh
          bash tests/run-ux44-obd-connect-tests.sh
          bash tests/run-ux45-obd-stability-tests.sh
          bash tests/run-ux46-ride-maintenance-tests.sh
      - name: Compile Android application and run lint and unit tests
        working-directory: MOTO-HUB
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest -PmotoReleaseCode=519 --no-daemon --stacktrace
      - name: Verify APK build outputs (signing happens outside CI)
        working-directory: MOTO-HUB
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | grep "versionCode='519'"
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > app/build/outputs/apk/release/SHA256-unsigned.txt
      - name: Archive unsigned release for private offline fixed signing
        uses: actions/upload-artifact@v4
        with:
          name: moto-ux47-unsigned-release-${{ github.sha }}
          path: |
            MOTO-HUB/app/build/outputs/apk/release/app-release-unsigned.apk
            MOTO-HUB/app/build/outputs/apk/release/SHA256-unsigned.txt
          if-no-files-found: error
          retention-days: 7
      - name: Archive build verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moto-ux47-test-reports
          path: |
            MOTO-HUB/app/build/reports/
            MOTO-HUB/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
# Debug build verifies compilation only. It is NOT fixed-signed and MUST NOT
# replace an installed user APK. Verified release workflow remains separate.
