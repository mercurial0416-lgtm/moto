name: MOTO HUB UI refresh compile and unit checks
on:
  push:
    branches: [ui-redesign-v572]
    paths:
      - 'MOTO-HUB/**'
      - '.github/workflows/moto-ui-refresh-check.yml'
  pull_request:
    paths:
      - 'MOTO-HUB/**'
      - '.github/workflows/moto-ui-refresh-check.yml'
permissions:
  contents: read
concurrency:
  group: moto-ui-refresh-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate UI structure and accessible actions
        working-directory: MOTO-HUB
        run: |
          python3 tests/test_workshop_ui.py
          python3 tests/test_readable_ui.py
      - name: Compile Android app, lint and unit tests
        working-directory: MOTO-HUB
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Upload unsigned-development-only verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moto-ui-v572-checks
          path: |
            MOTO-HUB/app/build/reports/
            MOTO-HUB/app/build/test-results/
          if-no-files-found: warn
          retention-days: 10
# CI only: does not modify the released APK, OTA manifest or private signing identity.
