name: Publish original-signed MOTO HUB v572 OTA (no private signing key)
on:
  push:
    branches: ['release/moto-hub-apk']
    paths:
      - '.github/verified-release/572.patch.zst.b64'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: moto-fixed-signed-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/release/moto-hub-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/moto-hub-apk
          fetch-depth: 0
          persist-credentials: false
      - name: Pin exact verified v572 source
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < MOTO-HUB/release-code.txt)" = 572
          git diff --quiet f6ffcb977370da33176ef7107583b0b80c680f87 HEAD -- MOTO-HUB/app MOTO-HUB/release-code.txt
          test -s .github/verified-release/572.patch.zst.b64
      - name: Obtain exact CI-tested unsigned v572 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=41472171678
          ACTUAL_SHA=$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          CONCLUSION=$(gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
          test "$ACTUAL_SHA" = 23002194870e06eb0ca4734cb2308e4d4942eb0b
          test "$CONCLUSION" = success
          mkdir -p "$RUNNER_TEMP/unsigned"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" \
            --name 'moto-ux76-unsigned-release-and-play-aab-31f98cade7e6ac8394a5808ad90346dd117fec71' --dir "$RUNNER_TEMP/unsigned"
          APK=$(find "$RUNNER_TEMP/unsigned" -name 'app-release-unsigned.apk' -type f | head -1)
          test -n "$APK" && test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/unsigned-v572.apk"
          echo '3ee92e04f62a9dd1eeea1b0ead9300f42ed1764055eb63c5d01f4791e8009aa9  '"$RUNNER_TEMP/unsigned-v572.apk" | sha256sum -c -
      - name: Rebuild exactly offline-signed APK from public binary delta
        run: |
          set -euo pipefail
          base64 --decode < .github/verified-release/572.patch.zst.b64 > "$RUNNER_TEMP/v572.patch.zst"
          echo '047c6043532509fb4f0dd2fc92b49bcede08cb7c7fe5a02b6fca8323f84dbff9  '"$RUNNER_TEMP/v572.patch.zst" | sha256sum -c -
          zstd -q -d --patch-from="$RUNNER_TEMP/unsigned-v572.apk" \
            "$RUNNER_TEMP/v572.patch.zst" -o "$RUNNER_TEMP/MOTO-HUB.apk"
          echo '553ab5774650177b221328ed39ff1e88a7aba8e4e0e17b5272f9e4ee4f5a789a  '"$RUNNER_TEMP/MOTO-HUB.apk" | sha256sum -c -
          test "$(stat -c%s "$RUNNER_TEMP/MOTO-HUB.apk")" -eq 47403598
          unzip -tq "$RUNNER_TEMP/MOTO-HUB.apk"
      - name: Verify package, Android signature and original installed-app certificate
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$SIGNER" verify --min-sdk-version 26 --verbose --print-certs "$RUNNER_TEMP/MOTO-HUB.apk" > "$RUNNER_TEMP/signature.txt"
          grep -Fqx 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          grep -Fqx 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/signature.txt"
          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test "$CERT" = 212c5b39d0082ab4bed78f8da2b719819cd80a20bc116c84f8bdfabca507021b
          "$AAPT" dump badging "$RUNNER_TEMP/MOTO-HUB.apk" | grep -F "package: name='com.motohub.next' versionCode='572'"
          python3 MOTO-HUB/tools/make_update_manifest.py \
            --apk "$RUNNER_TEMP/MOTO-HUB.apk" \
            --apk-url "https://github.com/$GITHUB_REPOSITORY/releases/download/moto-hub-v572/MOTO-HUB.apk" \
            --aapt "$AAPT" --apksigner "$SIGNER" \
            --output "$RUNNER_TEMP/manifest-572.json"
      - name: Publish verified original-signed v572 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode | python3 -c 'import json,sys;print(json.load(sys.stdin)["versionCode"])')
          test "$CURRENT" -eq 571 || { echo "::error::Public manifest already advanced to $CURRENT; refusing stale release"; exit 1; }
          TAG=moto-hub-v572
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --target f6ffcb977370da33176ef7107583b0b80c680f87 --title 'MOTO HUB v572 · 네이티브 UI 리뉴얼' \
              --notes 'Verified fixed signed APK. Existing local data preserved on in-place update.'
          fi
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'MOTO-HUB.apk'; then
            echo "::error::Release already contains an APK; refusing to overwrite existing binary"
            exit 1
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/MOTO-HUB.apk#MOTO-HUB.apk" --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'MOTO-HUB.apk'
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
      - name: Update public manifest to v572 only after APK publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=moto-hub-v572
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'MOTO-HUB.apk'
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode | python3 -c 'import json,sys;print(json.load(sys.stdin)["versionCode"])')
          if (( CURRENT == 572 )); then
            echo 'Manifest v572 already active'; exit 0
          fi
          test "$CURRENT" -eq 571 || { echo "::error::Newer manifest detected"; exit 1; }
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json?ref=main" --jq .sha)
          B64=$(base64 --wrap=0 "$RUNNER_TEMP/manifest-572.json")
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json" \
            -f branch=main -f sha="$SHA" -f content="$B64" \
            -f message='Publish verified original-signed MOTO HUB v572 OTA [skip ci]'
          NEW=$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode | python3 -c 'import json,sys;print(json.load(sys.stdin)["versionCode"])')
          test "$NEW" -eq 572
          echo 'Verified v572 published to in-app updater.'
