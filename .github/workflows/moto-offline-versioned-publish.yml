name: MOTO HUB verified in-app offline-signed publisher
on:
  push:
    branches: ['release/moto-hub-apk']
    paths:
      - 'signed-artifacts/v*-signing-block.json'
permissions:
  contents: write
concurrency:
  group: moto-hub-offline-signed-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK tools for signature verification
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Identify the sole new public signature patch
        run: |
          set -euo pipefail
          mapfile -t CHANGED < <(git diff --name-only HEAD^ HEAD -- 'signed-artifacts/v*-signing-block.json')
          test "${#CHANGED[@]}" -eq 1 || { echo "::error::Expected exactly one new signed APK patch"; exit 1; }
          PATCH="${CHANGED[0]}"
          test -f "$PATCH"
          echo "PATCH=$PATCH" >> "$GITHUB_ENV"
          python3 - "$PATCH" >> "$GITHUB_ENV" <<'PY'
          import json,sys,re
          x=json.load(open(sys.argv[1]))
          code=x['versionCode']; run=x['sourceRunId']; sha=x['sourceSha']
          if type(code)!=int or not 525<=code<=999999999: raise ValueError('Invalid release version')
          if type(run)!=int or run<=0:raise ValueError('Invalid build run')
          if not re.fullmatch('[0-9a-f]{40}',sha):raise ValueError('Invalid source commit')
          if sys.argv[1]!=f'signed-artifacts/v{code}-signing-block.json':
           raise ValueError('Version/patch path mismatch')
          print(f'CODE={code}')
          print(f'SOURCE_RUN={run}')
          print(f'SOURCE_SHA={sha}')
          PY
      - name: Download exact previously verified candidate (no signing keys)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          RESULT=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
          test "$SHA" = "$SOURCE_SHA" && test "$RESULT" = "success" || { echo "::error::Referenced source build is not verified"; exit 1; }
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "moto-hub-unsigned-$SOURCE_SHA" --dir "$RUNNER_TEMP/unsigned"
          APK="$RUNNER_TEMP/unsigned/app-release-unsigned.apk"
          test -s "$APK"
          EXPECTED=$(cut -d' ' -f1 "$RUNNER_TEMP/unsigned/unsigned.sha256")
          ACTUAL=$(sha256sum "$APK" | cut -d' ' -f1)
          test "$EXPECTED" = "$ACTUAL"
      - name: Reconstitute preauthorized signed bytes and verify Android certificate
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/MOTO-HUB.apk"
          python3 MOTO-HUB/tools/reassemble_preauthorized_signed_apk.py \
            --unsigned "$RUNNER_TEMP/unsigned/app-release-unsigned.apk" \
            --signature-patch "$PATCH" --output "$APK"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$SIGNER" verify --verbose "$APK"
          CERT=$("$SIGNER" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
            head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test "$CERT" = "212c5b39d0082ab4bed78f8da2b719819cd80a20bc116c84f8bdfabca507021b"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.motohub.next'" | grep -F "versionCode='$CODE'"
          python3 MOTO-HUB/tools/make_update_manifest.py \
            --apk "$APK" --apk-url "https://github.com/$GITHUB_REPOSITORY/releases/download/moto-hub-v$CODE-offline/MOTO-HUB.apk" \
            --aapt "$AAPT" --apksigner "$SIGNER" --output "$RUNNER_TEMP/manifest.json"
      - name: Publish release then update live in-app version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="moto-hub-v$CODE-offline"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Existing tag $TAG; will not replace published APK"
            exit 1
          fi
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json?ref=main" --jq .sha)
          CURRENT_CODE=$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json?ref=main" --jq .content |
            tr -d '\n' | base64 --decode |
            python3 -c 'import json,sys; print(int(json.load(sys.stdin)["versionCode"]))')
          test "$CODE" -gt "$CURRENT_CODE" || { echo "::error::Refusing downgrade or same version"; exit 1; }
          gh release create "$TAG" "$RUNNER_TEMP/MOTO-HUB.apk#MOTO-HUB.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "MOTO HUB $CODE - 앱 내 업데이트" \
            --notes "Fixed certificate, local data retained for compatible in-place upgrades."
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'MOTO-HUB.apk'
          B64=$(base64 --wrap=0 "$RUNNER_TEMP/manifest.json")
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json" \
            -f branch=main -f sha="$CURRENT_SHA" -f content="$B64" \
            -f message="Publish offline-verified in-app APK $CODE [skip ci]"
          echo "Release $CODE is now visible to installed app."
