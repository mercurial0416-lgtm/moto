name: MOTO HUB DI518 UX4 compile-only verification (NO APK)
on:
  push:
    branches: ['build/di518-ux4-prebuild-20261020', 'fix/di518-ux5-record-stability-20261020', 'fix/di518-ux6-reliability-20261020', 'fix/di518-ux7-photo-ride-recovery-20261020', 'fix/di518-ux8-gps-photo-update-safety-20261020', 'fix/di518-ux9-last-mile-20261020', 'fix/di518-ux10-ride-backup-edgecases-20261020']
    paths:
      - 'MOTO-HUB/**'
      - '.github/workflows/di518-ux4-compile-only.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moto-di518-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Pure-Java UX and privacy regressions
        working-directory: MOTO-HUB
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/json.jar" https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          export JSON_JAR="$RUNNER_TEMP/json.jar"
          for test in tests/run-*.sh; do bash "$test"; done
      - name: Android Java compile ONLY (no APK, no signing)
        working-directory: MOTO-HUB
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugJavaWithJavac :app:lintDebug :app:testDebugUnitTest --no-daemon
      - name: Verify no APK outputs were created
        run: |
          test ! -d MOTO-HUB/app/build/outputs/apk || { echo 'Unexpected APK output!'; exit 1; }
