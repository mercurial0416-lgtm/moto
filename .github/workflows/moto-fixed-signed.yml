name: Fixed-signature MOTO HUB update APK
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish verified APK and update manifest (requires private secrets)'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: moto-fixed-signed-release
  cancel-in-progress: false
jobs:
  verified-fixed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout public update manifest
        uses: actions/checkout@v4
        with:
          ref: main
          path: release-meta
      - name: Checkout integrated Android source
        uses: actions/checkout@v4
        with:
          ref: build/di518-ux4-prebuild-20261020
          path: source
          persist-credentials: false
      # Never publish the old integrated source while UI/update changes still live
      # only in feature PRs. This fails closed until UX38/39/40 are reviewed and merged
      # into the exact integrated source branch checked out above.
      - name: Require reviewed UX40 source and verify UI/update regressions
        run: |
          set -euo pipefail
          test -s source/MOTO-HUB/app/src/main/java/com/motohub/next/UpdateVersionPolicy.java || { echo 'UX40 not integrated; refuse stale fixed-signed release'; exit 1; }
          test -s source/MOTO-HUB/tests/test_readable_ui.py || { echo 'UX39 not integrated'; exit 1; }
          test -s source/MOTO-HUB/tests/test_workshop_ui.py || { echo 'UX38 not integrated'; exit 1; }
          python3 source/MOTO-HUB/tests/test_workshop_ui.py
          python3 source/MOTO-HUB/tests/test_readable_ui.py
          bash source/MOTO-HUB/tests/run-ux40-update-policy-tests.sh
          test -s source/MOTO-HUB/app/src/main/java/com/motohub/next/UpdateProgressPolicy.java || { echo 'UX41 not integrated'; exit 1; }
          bash source/MOTO-HUB/tests/run-ux41-update-progress-tests.sh
          test -s source/MOTO-HUB/app/src/main/java/com/motohub/next/UpdateResumePolicy.java || { echo 'UX42 resume missing'; exit 1; }
          test -s source/MOTO-HUB/app/src/main/java/com/motohub/next/UpdateInstallSnapshot.java || { echo 'UX42 backup gate missing'; exit 1; }
          bash source/MOTO-HUB/tests/run-ux42-update-integrity-tests.sh
          test -s source/MOTO-HUB/app/src/main/java/com/motohub/next/UpdateRecoveryPolicy.java || { echo 'UX43 recovery pinning missing'; exit 1; }
          test -s source/MOTO-HUB/app/src/main/java/com/motohub/next/UpdateErrorText.java || { echo 'UX43 safe error policy missing'; exit 1; }
          bash source/MOTO-HUB/tests/run-ux43-stability-tests.sh
          test -s source/MOTO-HUB/app/src/main/java/com/motohub/next/ObdFirstConnectionGuide.java || { echo 'UX44 OBD readiness missing'; exit 1; }
          bash source/MOTO-HUB/tests/run-ux44-obd-connect-tests.sh
          test -s source/MOTO-HUB/app/src/main/java/com/motohub/next/ObdSpeedSanityPolicy.java || { echo 'UX45 OBD speed sanity missing'; exit 1; }
          test -s source/MOTO-HUB/app/src/main/java/com/motohub/next/ObdLocalDiagnosticLog.java || { echo 'UX45 private diagnostic log missing'; exit 1; }
          bash source/MOTO-HUB/tests/run-ux45-obd-stability-tests.sh
          test -s source/MOTO-HUB/app/src/main/java/com/motohub/next/RideMileageIntegrity.java || { echo 'UX46 mileage integrity missing'; exit 1; }
          bash source/MOTO-HUB/tests/run-ux46-ride-maintenance-tests.sh
          test -s source/MOTO-HUB/app/src/main/java/com/motohub/next/RideHomeStatus.java || { echo 'UX48 large history scan missing'; exit 1; }
          test -s source/MOTO-HUB/app/src/main/java/com/motohub/next/ObdLatencyStats.java || { echo 'UX48 read-only OBD timing missing'; exit 1; }
          bash source/MOTO-HUB/tests/run-ux48-stability-tests.sh
      - name: Select next version and test release policy
        id: release-version
        run: |
          set -euo pipefail
          CODE=$(python3 source/MOTO-HUB/tools/choose_release_version.py \
            --gradle source/MOTO-HUB/app/build.gradle \
            --manifest release-meta/updates/manifest.json)
          printf 'code=%s\n' "$CODE" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 source/MOTO-HUB/tests/test_release_version.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require persistent signing key
        env:
          KEYSTORE_B64: ${{ secrets.MOTO_SIGNING_STORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOTO_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOTO_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOTO_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Missing fixed signing secrets; refusing APK'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/moto-fixed.p12"
          test -s "$RUNNER_TEMP/moto-fixed.p12"
      - name: Build, lint, and test fixed-signed release
        env:
          MOTO_SIGNING_STORE_FILE: ${{ runner.temp }}/moto-fixed.p12
          MOTO_SIGNING_STORE_PASSWORD: ${{ secrets.MOTO_SIGNING_STORE_PASSWORD }}
          MOTO_SIGNING_KEY_ALIAS: ${{ secrets.MOTO_SIGNING_KEY_ALIAS }}
          MOTO_SIGNING_KEY_PASSWORD: ${{ secrets.MOTO_SIGNING_KEY_PASSWORD }}
          NEXT_CODE: ${{ steps.release-version.outputs.code }}
        working-directory: source/MOTO-HUB
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:lintRelease :app:testReleaseUnitTest \
            -PmotoReleaseCode="$NEXT_CODE" --no-daemon
      - name: Verify APK package, version, certificate and checksum
        env:
          NEXT_CODE: ${{ steps.release-version.outputs.code }}
          SOURCE_REVISION: ${{ steps.release-version.outputs.revision }}
        working-directory: source/MOTO-HUB
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$SIGNER" verify --verbose --print-certs "$APK" > app/build/outputs/apk/release/signature.txt
          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' app/build/outputs/apk/release/signature.txt | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test "$CERT" = "212c5b39d0082ab4bed78f8da2b719819cd80a20bc116c84f8bdfabca507021b" || { echo "Wrong certificate"; exit 1; }
          "$AAPT" dump badging "$APK" > app/build/outputs/apk/release/badging.txt
          grep -q "package: name='com.motohub.next'" app/build/outputs/apk/release/badging.txt
          grep -q "versionCode='$NEXT_CODE'" app/build/outputs/apk/release/badging.txt
          sha256sum "$APK" > app/build/outputs/apk/release/SHA256.txt
          printf 'source_revision=%s\nversion_code=%s\ncertificate_sha256=%s\n' "$SOURCE_REVISION" "$NEXT_CODE" "$CERT" > app/build/outputs/apk/release/release-verification.txt
          cat app/build/outputs/apk/release/SHA256.txt >> app/build/outputs/apk/release/release-verification.txt
      - name: Archive exact built source (no keystore)
        run: |
          git -C source archive --format=zip --output="$GITHUB_WORKSPACE/MOTO-HUB-source.zip" HEAD:MOTO-HUB
          sha256sum MOTO-HUB-source.zip > MOTO-HUB-source-SHA256.txt
      - name: Preserve verified APK, reports and source
        uses: actions/upload-artifact@v4
        with:
          name: MOTO-HUB-FIXED-v${{ steps.release-version.outputs.code }}-${{ steps.release-version.outputs.revision }}
          path: |
            source/MOTO-HUB/app/build/outputs/apk/release/
            source/MOTO-HUB/app/build/reports/
            source/MOTO-HUB/app/build/test-results/
            MOTO-HUB-source.zip
            MOTO-HUB-source-SHA256.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified release and manifest (opt-in only)
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_CODE: ${{ steps.release-version.outputs.code }}
        run: |
          set -euo pipefail
          APK=source/MOTO-HUB/app/build/outputs/apk/release/app-release.apk
          TAG="moto-hub-v$NEXT_CODE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Existing tag: refusing overwrite"; exit 1; fi
          gh release create "$TAG" "$APK#MOTO-HUB.apk" --repo "$GITHUB_REPOSITORY" --title "MOTO HUB $NEXT_CODE (fixed signed)" --notes "Fixed certificate update; install only if current certificate matches."
          ASSET="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/MOTO-HUB.apk"
          python3 source/MOTO-HUB/tools/make_update_manifest.py \
            --apk "$APK" --apk-url "$ASSET" \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --output release-meta/updates/manifest.json
          git -C release-meta config user.name 'github-actions[bot]'
          git -C release-meta config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C release-meta add updates/manifest.json
          git -C release-meta commit -m "Publish fixed-signed MOTO HUB $NEXT_CODE update [skip ci]"
          git -C release-meta push origin HEAD:main
      - name: Erase temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/moto-fixed.p12"
