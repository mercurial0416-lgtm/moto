name: Publish verified offline-signed MOTO HUB v569 OTA (no private key in GitHub)
on:
  push:
    branches: ['release/moto-hub-apk']
    paths:
      - '.github/verified-release/569.patch.zst.b64'
      - '.github/workflows/moto-publish-verified-569.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: moto-fixed-signed-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/moto-hub-apk
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: release-meta
          persist-credentials: true
      - name: Pin tested v569 source and public manifest
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < MOTO-HUB/release-code.txt)" = 569
          # The checked unsigned APK was built from the exact v569 source tree
          # (PR #128 verified head 83e2f250; release squash 80c78631).
          git diff --quiet 21edb36ac91f848d4eaaa05dbd99ac67d9a6e794 HEAD -- MOTO-HUB/app MOTO-HUB/release-code.txt
          test "$(git rev-parse 21edb36ac91f848d4eaaa05dbd99ac67d9a6e794^{tree})" = 40db6c35c1acd67321ee82d5cd5e6fbfd0af87fa
          CURRENT=$(python3 -c 'import json;print(int(json.load(open("release-meta/updates/manifest.json"))["versionCode"]))')
          test "$CURRENT" -lt 569 || { echo "::error::Published version already 569 or newer"; exit 1; }
      - name: Retrieve exact CI-generated unsigned v569 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13096696640/zip" > "$RUNNER_TEMP/unsigned-archive.zip"
          unzip -tq "$RUNNER_TEMP/unsigned-archive.zip"
          unzip -p "$RUNNER_TEMP/unsigned-archive.zip" 'apk/release/app-release-unsigned.apk' > "$RUNNER_TEMP/unsigned-v569.apk"
          echo 'a82af550149a1290ad0bef60adba094fe1e313aa1232cd6c87455f844ef4d090  '"$RUNNER_TEMP/unsigned-v569.apk" | sha256sum -c -
      - name: Recover exactly locally signed, certificate-bound APK
        run: |
          set -euo pipefail
          base64 --decode < .github/verified-release/569.patch.zst.b64 > "$RUNNER_TEMP/v569.patch.zst"
          echo '04826c7698fc863e12ac982615fa5ad30a517d076f23430c66ee9899908fd3b2  '"$RUNNER_TEMP/v569.patch.zst" | sha256sum -c -
          zstd -q -d --patch-from="$RUNNER_TEMP/unsigned-v569.apk" "$RUNNER_TEMP/v569.patch.zst" -o "$RUNNER_TEMP/MOTO-HUB.apk"
          echo 'e4b19ad4f1f6970f8c81553f1be61100d99a5fa586d06d5b8b454dab124629bb  '"$RUNNER_TEMP/MOTO-HUB.apk" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/MOTO-HUB.apk"
      - name: Verify Android v569, package and original signer (no key exposed)
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$SIGNER" verify --min-sdk-version 26 --verbose --print-certs "$RUNNER_TEMP/MOTO-HUB.apk" > "$RUNNER_TEMP/signature.txt"
          grep -Fqx 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          grep -Fqx 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/signature.txt"
          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test "$CERT" = 212c5b39d0082ab4bed78f8da2b719819cd80a20bc116c84f8bdfabca507021b || { echo "::error::Original signer mismatch"; exit 1; }
          "$AAPT" dump badging "$RUNNER_TEMP/MOTO-HUB.apk" | grep -F "package: name='com.motohub.next' versionCode='569'"
          test "$(sha256sum "$RUNNER_TEMP/MOTO-HUB.apk" | cut -d' ' -f1)" = e4b19ad4f1f6970f8c81553f1be61100d99a5fa586d06d5b8b454dab124629bb
      - name: Publish v569 asset, then advance the existing OTA manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode | python3 -c 'import json,sys;print(json.load(sys.stdin)["versionCode"])')
          test "$CURRENT" -lt 569 || { echo "::error::Manifest has already advanced"; exit 1; }
          TAG=moto-hub-v569
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Existing v569 release requires manual inspection; refusing overwrite"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-v569"
          cp "$RUNNER_TEMP/MOTO-HUB.apk" "$RUNNER_TEMP/release-v569/MOTO-HUB.apk"
          gh release create "$TAG" "$RUNNER_TEMP/release-v569/MOTO-HUB.apk" --repo "$GITHUB_REPOSITORY" --target 21edb36ac91f848d4eaaa05dbd99ac67d9a6e794 --title 'MOTO HUB 569 (original signed)' --notes 'Offline original-key signature verified. In-app update preserves compatible installed application data.'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'MOTO-HUB.apk'
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/MOTO-HUB.apk"
          python3 MOTO-HUB/tools/make_update_manifest.py --apk "$RUNNER_TEMP/MOTO-HUB.apk" --apk-url "$URL" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --output "$RUNNER_TEMP/manifest-v569.json"
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1])); assert d["versionCode"]==569; assert d["packageName"]=="com.motohub.next"; assert d["certificateSha256"]=="212c5b39d0082ab4bed78f8da2b719819cd80a20bc116c84f8bdfabca507021b"' "$RUNNER_TEMP/manifest-v569.json"
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json?ref=main" --jq .sha)
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json?ref=main" --jq .content | tr -d '\n' | base64 --decode | python3 -c 'import json,sys;print(json.load(sys.stdin)["versionCode"])')
          test "$LATEST" -lt 569 || { echo "::error::Concurrent newer manifest; refusing overwrite"; exit 1; }
          PAYLOAD=$(base64 --wrap=0 "$RUNNER_TEMP/manifest-v569.json")
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/updates/manifest.json" -f branch=main -f sha="$SHA" -f content="$PAYLOAD" -f message="Publish verified original-signed MOTO HUB v569 OTA"
          echo 'v569 original-signed OTA published in main/updates/manifest.json'
